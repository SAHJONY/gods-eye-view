  <!-- Unified bottom command dock: locations, voice (injected at runtime), visual presets -->
  <div id="command-dock" aria-label="Controles de navegación, voz y preajustes visuales">
  <!-- Control panel -->
  <div id="control-panel" class="panel-collapsible collapsed">
    <div class="panel-glow"></div>
    <div class="panel-inner">
      <button id="control-panel-toggle" class="panel-header dock-tray-toggle" type="button"
        data-dock-toggle-target="control-panel" aria-expanded="false"
        aria-controls="control-panel-popover" aria-label="Expandir preajustes visuales">
        <span class="panel-title"><span class="dock-label-icon dock-label-icon-presets" aria-hidden="true"></span>PREAJUSTES VISUALES</span>
        <span class="panel-divider"></span>
      </button>
      <div id="control-panel-popover" class="dock-popover-content">
      <button class="dock-pin-btn" data-pin-target="control-panel" type="button" aria-label="Fijar preajustes visuales" aria-pressed="false" title="Mantener abiertos los preajustes visuales"><img src="/pin.svg" alt="" /></button>
      <div id="style-buttons" class="button-grid">
        <button class="style-btn active" data-style="normal" title="Muestra el globo sin filtro visual.">
          <span class="btn-icon">◯</span>
          <span class="btn-label">Normal</span>
          <span class="btn-key">1</span>
        </button>
        <button class="style-btn" data-style="retro" title="Emula un CRT de fósforo verde con líneas de barrido y curvatura de pantalla.">
          <span class="btn-icon">▦</span>
          <span class="btn-label">CRT</span>
          <span class="btn-key">2</span>
        </button>
        <button class="style-btn" data-style="surveillance" title="Simula gafas de visión nocturna con intensificación verde y viñeta de tubo.">
          <span class="btn-icon">🌙</span>
          <span class="btn-label">NVG</span>
          <span class="btn-key">3</span>
        </button>
        <button class="style-btn" data-style="thermal" title="Simula contraste térmico estilo FLIR. Sube Ironbow para color.">
          <span class="btn-icon">🌡️</span>
          <span class="btn-label">FLIR</span>
          <span class="btn-key">4</span>
        </button>
        <button class="style-btn" data-style="anime" title="Aplica color cel-shading brillante y contornos ilustrados.">
          <span class="btn-icon">✦</span>
          <span class="btn-label">Anime</span>
          <span class="btn-key">5</span>
        </button>
        <button class="style-btn" data-style="noir" title="Aplica gradación monocromática de alto contraste estilo film noir.">
          <span class="btn-icon">◐</span>
          <span class="btn-label">Noir</span>
          <span class="btn-key">6</span>
        </button>
        <button class="style-btn" data-style="snow" title="Agrega un tratamiento frío de tormenta de nieve a la escena.">
          <span class="btn-icon">❄</span>
          <span class="btn-label">Nieve</span>
          <span class="btn-key">7</span>
        </button>
      </div>
      <section class="map-source-section" aria-labelledby="map-source-label">
        <div class="map-source-heading">
          <span id="map-source-label">FUENTE DE MAPA</span>
          <span id="map-stack-status" class="pp-stack-status" aria-live="polite">3D</span>
        </div>
        <div id="map-stack-chips" class="map-stack-chip-row" role="group" aria-label="Fuente de mapa"></div>
      </section>
      </div>
      <div id="style-mini-status" class="panel-mini-status" aria-live="polite">
        <span class="panel-mini-label">Estilo</span>
        <span id="style-mini-value" class="panel-mini-value">NORMAL</span>
      </div>
    </div>
  </div>

  <!-- Location bar -->
  <div id="location-bar" class="panel-collapsible collapsed">
    <div class="panel-glow"></div>
    <div class="location-inner">
      <div class="location-toolbar">
        <button id="location-bar-toggle" class="dock-tray-toggle" type="button" data-dock-toggle-target="location-bar" aria-controls="location-bar-popover" aria-expanded="false" aria-label="Expandir UBICACIÓN" title="Expandir UBICACIÓN">
          <span class="location-toolbar-label"><span class="dock-label-icon dock-label-icon-location" aria-hidden="true"></span>UBICACIÓN</span>
        </button>
        <button class="panel-collapse-btn" data-collapse-target="location-bar" title="Contraer panel">+</button>
      </div>
      <div id="location-mini-status" class="location-mini-status" aria-live="polite">
        <div id="location-mini-city" class="location-mini-city">📍 Ubicación: --</div>
        <div id="location-mini-poi" class="location-mini-poi">Punto de referencia: --</div>
      </div>
      <div id="location-bar-popover" class="dock-popover-content">
        <button class="dock-pin-btn" data-pin-target="location-bar" type="button" aria-label="Fijar bandeja de ubicación" aria-pressed="false" title="Mantener abierta la bandeja de ubicación"><img src="/pin.svg" alt="" /></button>
        <div id="poi-row" class="poi-row-container"></div>
        <div class="location-bar-divider" id="location-bar-divider"></div>
        <div class="location-city-row">
          <div id="location-pills" class="location-pills"></div>
          <div class="location-search-wrap">
            <button id="search-toggle" class="search-toggle-btn" title="Buscar cualquier ubicación">
              <span>&#x1F50E;</span>
            </button>
            <input type="text" id="location-search" placeholder="Buscar cualquier ubicación..." autocomplete="off" spellcheck="false" aria-label="Buscar ubicación por nombre o coordenadas" />
          </div>
        </div>
      </div>
    </div>
  </div>
  </div>
