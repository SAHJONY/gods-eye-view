  </div>

  </div>

  <nav id="top-center-actions" aria-label="Acciones del globo">
    <button id="clear-selected-layers" type="button" aria-label="Borrar capas de datos seleccionadas" title="Apagar todas las capas de datos seleccionadas">
      <span class="material-symbols-outlined" aria-hidden="true">layers_clear</span>
    </button>
    <button id="share-btn" type="button" aria-label="Copiar enlace para compartir" title="Copiar enlace para compartir">

    <button id="tilt-map-view" type="button" aria-label="Inclinar mapa a vista oblicua" aria-pressed="false" title="Alternar entre vista cenital e inclinada">

    <button id="north-up-view" type="button" aria-label="Restablecer mapa con el norte arriba" title="Restablecer el rumbo del mapa al norte">

    </button>
    <button id="reset-globe-view" type="button" aria-label="Restablecer a vista completa del globo" title="Restablecer cámara y volver a la vista completa del globo">
