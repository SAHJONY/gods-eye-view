  <!-- Post-processing toggles (top-right) -->
  <div id="pp-toggles" class="panel-collapsible collapsed" data-panel-id="pp-toggles">
    <div class="compact pp-header-row">
      <span class="pp-header-label">PANTALLA</span>
      <span class="panel-divider" aria-hidden="true"></span>
      <button class="panel-collapse-btn pp-collapse-btn" data-collapse-target="pp-toggles" title="Contraer panel">&#x25C0;</button>
    </div>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="hud-toggle" title="HUD de inteligencia (H)">
        <span class="pp-icon">&#x25CE;</span>
        <span class="pp-label">HUD</span>
      </button>
      <div class="pp-slider-row" id="hud-layout-row">
        <span class="pp-slider-mini-label">Diseño</span>
        <select id="hud-layout-select" class="pp-select" aria-label="Diseño del HUD">
          <option value="tactical">Táctico</option>
          <option value="operator">Operador</option>
          <option value="minimal">Mínimo</option>
        </select>
      </div>
    </div>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="detection-toggle" title="Superposición de detección (D)" aria-label="Superposición de detección" aria-pressed="false">
        <span class="pp-icon">&#x25A3;</span>
        <span class="pp-label">DETECCIÓN</span>
      </button>
      <div class="pp-slider-row detection-slider-row" id="detection-slider-row">
        <label class="pp-slider-mini-label" for="detection-density-slider">Densidad</label>
        <input type="range" class="pp-slider" id="detection-density-slider" min="0" max="100" step="25" value="50" aria-label="Densidad de etiquetas de detección" />
        <span class="pp-slider-value" id="detection-density-value">50%</span>
      </div>
      <div class="pp-slider-row detection-allocation-row" id="detection-allocation-row">
        <span class="pp-slider-mini-label">Asignación</span>
        <div class="pp-mode-seg detection-allocation-seg" role="radiogroup" aria-label="Asignación de etiquetas de detección">
          <button class="pp-mode-btn active" id="detection-allocation-elastic" data-allocation="ELASTIC" role="radio" aria-checked="true">Elástica</button>
          <button class="pp-mode-btn" id="detection-allocation-weighted" data-allocation="WEIGHTED" role="radio" aria-checked="false">Ponderada</button>
        </div>
      </div>
      <div class="pp-slider-row detection-fade-row" id="detection-fade-row">
        <label class="pp-slider-mini-label" for="detection-fade-slider">Atenuación</label>
        <input type="range" class="pp-slider" id="detection-fade-slider" min="0" max="40" step="1" value="7" aria-label="Distancia de atenuación de detección" title="Distancia de atenuación de la superposición fuera del área visible, como porcentaje de su radio" />
        <span class="pp-slider-value" id="detection-fade-value">7%</span>
      </div>
      <div class="pp-slider-row detection-opacity-row" id="detection-opacity-row">
        <label class="pp-slider-mini-label" for="detection-opacity-slider">Exterior</label>
        <input type="range" class="pp-slider" id="detection-opacity-slider" min="0" max="100" step="1" value="1" aria-label="Opacidad de detección fuera del área visible" title="Opacidad de etiquetas y tarjetas de la superposición más allá de la distancia de atenuación" />
        <span class="pp-slider-value" id="detection-opacity-value">1%</span>
      </div>
    </div>
    <!-- The one shared preset-parameter surface is inserted here at runtime. -->
    <div id="param-slider-panel">
      <div class="param-panel-header">
        <span class="param-panel-title">PARÁMETROS</span>
        <span class="param-panel-divider"></span>
        <button class="panel-collapse-btn" id="param-panel-collapse-btn" data-collapse-target="param-slider-panel" title="Contraer panel">−</button>
      </div>
      <div id="param-sliders"></div>
    </div>
    <div class="pp-toggle-group">
      <!-- 3D aircraft is DEFAULT-ON in Proximity (owner directive 2026-08-22), so the
           button ships lit and the mode row ships open — the same markup-carries-the-default
           convention as #scope-toggle. ui.js re-syncs both from durable layer state, which
           is what flips them back for a share link or a stored session carrying 3D off. -->
      <button class="pp-toggle-btn active" id="models3d-toggle" aria-pressed="true" title="Aviones 3D: iconos planos al alejar, modelos 3D de cerca">
        <span class="pp-icon">&#x2708;</span>
        <span class="pp-label">3D</span>
      </button>
      <div class="pp-slider-row visible" id="models3d-mode-row">
        <span class="pp-slider-mini-label">Modelos</span>
        <div class="pp-mode-seg" role="radiogroup" aria-label="Cobertura de modelos 3D">
          <button class="pp-mode-btn active" id="models3d-mode-proximity" data-mode="proximity" role="radio" aria-checked="true">Proximidad</button>
          <button class="pp-mode-btn" id="models3d-mode-all" data-mode="all" role="radio" aria-checked="false">Todos</button>
        </div>
      </div>
    </div>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn active" id="scope-toggle" title="Mira: la máscara circular del visor" aria-pressed="true">
        <span class="pp-icon material-symbols-outlined" aria-hidden="true">adjust</span>
        <span class="pp-label">Mira</span>
      </button>
      <div class="pp-slider-row visible" id="scope-slider-row">
        <span class="pp-slider-mini-label">Difuminado</span>
        <!-- Feather starts at an 11% soft scope-mask edge (owner final lock
             2026-08-24, superseding the 08-22 hard-crop and 08-23 8% rulings);
             mirrors SCOPE_FEATHER_RATIO_DEFAULT in src/scopeMask.js. Feather
             softens the black mask edge; label fading is the separate Fade
             slider. -->
        <input type="range" class="pp-slider" id="scope-feather-slider" min="0" max="100" value="11" aria-label="Difuminado del borde de la mira" title="Difuminado del borde de la mira como porcentaje del radio del área visible" />
        <span class="pp-slider-value" id="scope-feather-value">11%</span>
      </div>
    </div>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="draw-toggle" title="Dibujar en el mundo: clic para vértices, doble clic o Enter para terminar, Esc para cancelar" aria-pressed="false">
        <span class="pp-icon material-symbols-outlined" aria-hidden="true">draw</span>
        <span class="pp-label">Dibujar</span>
      </button>
      <div class="pp-slider-row" id="draw-mode-row">
        <span class="pp-slider-mini-label">Forma</span>
        <div class="pp-mode-seg" role="radiogroup" aria-label="Forma a dibujar">
          <button class="pp-mode-btn active" data-shape="area" role="radio" aria-checked="true">Área</button>
          <button class="pp-mode-btn" data-shape="line" role="radio" aria-checked="false">Línea</button>
          <button class="pp-mode-btn" data-shape="pin" role="radio" aria-checked="false">Marcador</button>
        </div>
      </div>
      <div class="pp-slider-row" id="draw-label-row">
        <input type="text" class="pp-text-input" id="draw-label-input" maxlength="120" placeholder="Etiqueta (opcional)" aria-label="Etiqueta para la forma dibujada" autocomplete="off" spellcheck="false">
        <select class="pp-select draw-color-select" id="draw-color-select" aria-label="Color de la forma dibujada">
          <option value="primary">Primario</option>
          <option value="amber">Ámbar</option>
          <option value="cyan">Cian</option>
          <option value="green">Verde</option>
          <option value="red">Rojo</option>
        </select>
        <button class="pp-mode-btn draw-clear-btn" id="draw-clear" type="button" title="Quitar todas las marcas del tablero">Borrar</button>
        <span class="draw-hint" id="draw-hint" aria-live="polite"></span>
      </div>
    </div>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="celestial-toggle" title="Anillo celestial: revela el globo completo" aria-pressed="false">
        <span class="pp-icon material-symbols-outlined" aria-hidden="true">flare</span>
        <span class="pp-label">Celestial</span>
      </button>
    </div>
    <button class="pp-toggle-btn" id="clean-view-toggle" title="Ocultar interfaz">
      <span class="pp-icon">&#x25A1;</span>
      <span class="pp-label">Interfaz limpia</span>
    </button>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="bloom-toggle" title="Resplandor">
        <span class="pp-icon">&#x2728;</span>
        <span class="pp-label">Resplandor</span>
      </button>
      <div class="pp-slider-row" id="bloom-slider-row">
        <input type="range" class="pp-slider" id="bloom-intensity-slider" min="0" max="200" value="0" aria-label="Intensidad de resplandor" />
        <span class="pp-slider-value" id="bloom-intensity-value">0%</span>
      </div>
    </div>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="sharpen-toggle" title="Nitidez">
        <span class="pp-icon">&#x1F50D;</span>
        <span class="pp-label">Nitidez</span>
      </button>
      <div class="pp-slider-row" id="sharpen-slider-row">
        <input type="range" class="pp-slider" id="sharpen-intensity-slider" min="0" max="100" value="49" aria-label="Intensidad de nitidez" />
        <span class="pp-slider-value" id="sharpen-intensity-value">49%</span>
      </div>
    </div>
  </div>
  <button id="clean-view-exit" title="Volver a los controles">SALIR DE VISTA LIMPIA</button>
