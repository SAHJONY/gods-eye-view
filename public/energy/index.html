<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAHJONY · Energía para Cuba</title>
<style>
:root{--navy-0:#04070f;--navy-1:#060d1d;--gold:#d4af37;--gold-soft:#e8c56a;--ink:#f2f5fa;--muted:#8fa0b8;--line:rgba(212,175,55,.22);--card:rgba(14,26,51,.72);--radius:16px;--grn:#4ade80;--yel:#facc15;--red:#f87171;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1200px 600px at 80% -10%,rgba(212,175,55,.08),transparent 60%),linear-gradient(180deg,var(--navy-1),var(--navy-0));min-height:100vh;font-size:16px;line-height:1.45;}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:rgba(6,13,29,.9);position:sticky;top:0;z-index:20;backdrop-filter:blur(8px);}
.back{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--gold);font-size:20px;cursor:pointer;display:grid;place-items:center;text-decoration:none;}
.brand{flex:1;min-width:0;} .brand h1{font-size:17px;margin:0;} .brand h1 .sub{display:block;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:1.2px;text-transform:uppercase;}
main{padding:14px 16px 60px;max-width:960px;margin:0 auto;}
h2{font-size:15px;color:var(--gold-soft);text-transform:uppercase;letter-spacing:1px;margin:26px 0 10px;}
.card{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:14px;margin-bottom:12px;}
.card h3{margin:0 0 2px;font-size:17px;} .card .spec{color:var(--gold-soft);font-size:13px;font-weight:600;margin-bottom:8px;}
.card .row{font-size:14px;margin:5px 0;} .card .notes{font-size:13px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;}
.warn{border:1px solid rgba(248,113,113,.45);background:rgba(51,14,14,.5);border-radius:var(--radius);padding:12px 14px;font-size:13px;margin-bottom:12px;}
.warn b{color:var(--red);}
.bdg{font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px;border:1px solid;white-space:nowrap;}
.bdg.strong{background:rgba(12,40,64,.6);color:#38bdf8;border-color:#38bdf8;}
.bdg.lead{background:rgba(51,39,10,.6);color:var(--yel);border-color:var(--yel);}
ul{padding-left:20px;font-size:14px;} li{margin:7px 0;}
.foot{color:var(--muted);font-size:12px;margin-top:26px;border-top:1px solid var(--line);padding-top:12px;}
</style>
</head>
<body>
<header>
  <a class="back" href="/platform/" aria-label="Volver">‹</a>
  <div class="brand"><h1>⚡ Energía para Cuba<span class="sub">Diésel · gasolina · gas</span></h1></div>
</header>
<main>
  <h2>Productos</h2>
  <div id="products"></div>
  <h2>Mercado</h2>
  <ul id="market"></ul>
  <div class="warn"><b>⛔ Legal / sanciones:</b><ul id="legal" style="margin:8px 0 0"></ul></div>
  <h2>Pendiente</h2>
  <ul id="pending"></ul>
  <div class="foot" id="foot"></div>
</main>
<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
fetch("data.json",{cache:"no-store"}).then(function(r){return r.json();}).then(function(d){
  document.getElementById("products").innerHTML=d.products.map(function(p){
    var b=p.status==="strong"?'<span class="bdg strong">SÓLIDO</span>':'<span class="bdg lead">PISTA</span>';
    return '<div class="card"><h3>'+esc(p.name)+' '+b+'</h3><div class="spec">'+esc(p.spec)+'</div>'+
    '<div class="row">📊 '+esc(p.benchmark)+'</div><div class="notes">'+esc(p.note)+'</div></div>';
  }).join("");
  document.getElementById("market").innerHTML=(d.market_notes||[]).map(function(m){return"<li>"+esc(m)+"</li>";}).join("");
  document.getElementById("legal").innerHTML=(d.legal||[]).map(function(m){return"<li>"+esc(m)+"</li>";}).join("");
  document.getElementById("pending").innerHTML=(d.pending||[]).map(function(m){return"<li>"+esc(m)+"</li>";}).join("");
  document.getElementById("foot").textContent="Inteligencia interna SAHJONY LLC · actualizado "+(d.updated||"—")+" · No compartir con terceros.";
}).catch(function(){document.getElementById("products").innerHTML='<div class="card">⚠️ No se pudo cargar data.json</div>';});
</script>
</body>
</html>
