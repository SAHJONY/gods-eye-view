<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Insurance Command Center</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#273449;--txt:#f1f5f9;--mut:#94a3b8;--acc:#38bdf8;--grn:#4ade80;--yel:#facc15;--red:#f87171;--brd:#334155}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.45;padding-bottom:90px}
header{position:sticky;top:0;z-index:10;background:#0b1220;border-bottom:1px solid var(--brd);padding:12px 14px}
h1{margin:0;font-size:20px}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
.langrow{display:flex;gap:8px;margin-top:10px}
.langbtn{flex:1;min-height:48px;border-radius:12px;border:2px solid var(--brd);background:var(--card);color:var(--txt);font-size:16px;font-weight:700}
.langbtn.on{border-color:var(--acc);background:#0c2a3d}
.biztabs{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 4px;scrollbar-width:none}
.biztab{flex:0 0 auto;min-height:52px;padding:10px 16px;border-radius:14px;border:2px solid var(--brd);background:var(--card);color:var(--txt);font-size:15px;font-weight:700;white-space:nowrap}
.biztab.on{border-color:var(--acc);background:#0c2a3d}
.viewtabs{display:flex;gap:8px;padding:10px 14px}
.viewtab{flex:1;min-height:52px;border-radius:14px;border:2px solid var(--brd);background:var(--card);color:var(--txt);font-size:16px;font-weight:700}
.viewtab.on{border-color:var(--grn);background:#0d2b1a}
main{padding:6px 14px}
.card{background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:16px;margin:12px 0}
.card h3{margin:0 0 6px;font-size:18px}
.pill{display:inline-block;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:800;margin:4px 6px 4px 0}
.gap{background:#3b1114;color:var(--red);border:1px solid var(--red)}
.active{background:#0d2b1a;color:var(--grn);border:1px solid var(--grn)}
.expsoon{background:#33270a;color:var(--yel);border:1px solid var(--yel)}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.btn{flex:1;min-height:52px;border-radius:14px;border:none;font-size:16px;font-weight:800;color:#0b1220;background:var(--acc)}
.btn.sec{background:var(--card2);color:var(--txt);border:2px solid var(--brd)}
.btn.dgr{background:#3b1114;color:var(--red);border:1px solid var(--red)}
.btn.grn{background:#0d2b1a;color:var(--grn);border:1px solid var(--grn)}
input,select,textarea{width:100%;min-height:52px;border-radius:12px;border:2px solid var(--brd);background:#0b1220;color:var(--txt);font-size:16px;padding:10px 12px;margin:6px 0}
textarea{min-height:110px;resize:vertical}
label{font-size:14px;color:var(--mut);font-weight:700}
.stages{display:flex;gap:4px;margin:10px 0}
.stage{flex:1;height:10px;border-radius:6px;background:var(--brd)}
.stage.done{background:var(--grn)}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--brd);border-radius:12px;margin:8px 0;min-height:56px}
.check input{width:28px;height:28px;min-height:28px;margin:0;flex:0 0 auto}
.alertcard{border-left:6px solid var(--red)}
.alertcard.warn{border-left-color:var(--yel)}
.st8{background:#0b1220;color:var(--acc);border:1px solid var(--acc)}
.fab{position:fixed;bottom:18px;right:18px;width:72px;height:72px;border-radius:50%;background:var(--acc);color:#0b1220;font-size:34px;font-weight:900;border:none;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:20;overflow-y:auto;padding:16px}
.modal.open{display:block}
.sheet{background:var(--card);border-radius:18px;padding:18px;max-width:640px;margin:20px auto}
.sheet h2{margin-top:0}
.disc{font-size:12px;color:var(--mut);padding:14px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--brd);font-size:15px}
.kv b{text-align:right}
@media print{.fab,.viewtabs,.biztabs,.langrow,.btn,.noprint{display:none!important}body{background:#fff;color:#000;padding:0}.card{background:#fff;border:1px solid #999;color:#000}}
</style>
</head>

function renderAlerts(m){
 let h="";const gaps=[],renew=[],catt=[],aatt=[],qexp=[];
 Object.keys(S.businesses).forEach(b=>{
  S.businesses[b].coverages.forEach(c=>{if(c.status==="gap")gaps.push({b:b,c:c})});
  S.businesses[b].coverages.forEach(c=>{if(c.status==="active"&&c.exp){const d=Math.ceil((new Date(c.exp)-Date.now())/864e5);if(d<=30)renew.push({b:b,c:c,d:d})}});
  S.businesses[b].claims.forEach(c=>{if(c.stage<5){const d=Math.ceil((Date.now()-new Date(c.date))/864e5);if(d>3)catt.push({b:b,c:c,d:d})}});
 });
 S.attorney.forEach(a=>{if(a.nextdate&&a.status<6){const d=Math.ceil((new Date(a.nextdate)-Date.now())/864e5);if(d<=7)aatt.push({a:a,d:d})}});
 S.quotes.forEach(q=>{if(q.exp){const d=Math.ceil((new Date(q.exp)-Date.now())/864e5);if(d<=14)qexp.push({q:q,d:d})}});
 if(!gaps.length&&!renew.length&&!catt.length&&!aatt.length&&!qexp.length){m.innerHTML='<div class="card">'+t("noalerts")+"</div>";return}
 gaps.forEach(g=>{h+='<div class="card alertcard"><b>'+t("gapalert")+"</b> — "+bizLabel(g.b)+"<br>"+esc(g.c.type)+' <span class="mut">(P'+g.c.priority+")</span></div>"});
 renew.forEach(r=>{h+='<div class="card alertcard warn"><b>'+t("renewalert")+"</b> — "+bizLabel(r.b)+"<br>"+esc(r.c.type)+" · "+r.d+" "+t("days")+"</div>"});
 catt.forEach(x=>{h+='<div class="card alertcard warn"><b>'+t("claimatt")+"</b> — "+bizLabel(x.b)+"<br>"+t("claimid")+" #"+esc(x.c.id)+" · "+x.d+" "+t("days")+"</div>"});
 aatt.forEach(x=>{h+='<div class="card alertcard warn"><b>'+t("attalert")+"</b><br>⚖️ "+esc(x.a.title)+" — "+esc(x.a.next||T[lang].astages[x.a.status])+" · "+(x.d<0?Math.abs(x.d)+" "+t("days")+" "+t("overdue"):x.d+" "+t("days"))+"</div>"});
 qexp.forEach(x=>{const qn=(lang==="es"?QTYPES_ES:QTYPES)[+x.q.type]||t("other");h+='<div class="card alertcard warn"><b>'+t("quotexp")+"</b><br>🛒 "+esc(qn)+" — "+esc(x.q.carrier)+" · "+(x.d<0?Math.abs(x.d)+" "+t("days")+" "+t("overdue"):x.d+" "+t("days"))+"</div>"});
 m.innerHTML=h;

function saveCoverage(id){
 const g=i=>document.getElementById(i).value.trim();

function openClaim(id){

 +'<div class="kv"><span>'+t("claimid")+'</span><b>#'+esc(c.id)+"</b></div>"
 +'<div class="kv"><span>'+t("ctype")+"</span><b>"+t(c.type)+"</b></div>"
 +'<div class="kv"><span>'+t("incident")+"</span><b>"+esc(c.date)+"</b></div>"
 +'<div class="kv"><span>'+t("status")+"</span><b>"+T[lang].stages[c.stage]+"</b></div>"
 +'<div class="mut" style="margin:8px 0">'+esc(c.desc)+"</div>"

 if(c.stage<5)h+='<button class="btn" onclick="advanceClaim(\''+id+"',true)\">→ "+T[lang].stages[c.stage+1]+"</button>";

function toggleDoc(id,i,v){const c=biz().claims.find(x=>x.id===id);c.docs[i].got=v;save()}
function addLog(id){const n=document.getElementById("lognote").value.trim();if(!n)return;
 const c=biz().claims.find(x=>x.id===id);c.log.push({d:new Date().toISOString().slice(0,10),n:n});save();openClaim(id)}
function advanceClaim(id,fromModal){
 const c=biz().claims.find(x=>x.id===id);
 c.stage=c.stage>=5?0:Math.min(5,c.stage+1);
 c.log.push({d:new Date().toISOString().slice(0,10),n:"Stage → "+T[lang].stages[c.stage]});
 save();if(fromModal)openClaim(id);else render();
}

 +'<label>'+t("att_firm")+'</label><input id="a_firm" value="'+esc(a.firm)+'">'
 +'<label>'+t("att_contact")+'</label><input id="a_contact" value="'+esc(a.contact)+'">'

 +'<label>'+t("att_venue")+'</label><input id="a_venue" value="'+esc(a.venue)+'">'
 +'<label>'+t("att_status")+'</label><select id="a_status">'+T[lang].astages.map((s,i)=>'<option value="'+i+'"'+(i===a.status?" selected":"")+">"+s+"</option>").join("")+"</select>"
 +'<label>'+t("att_next")+'</label><input id="a_next" value="'+esc(a.next)+'">'

}
function saveAttorney(id){
 const g=i=>document.getElementById(i).value.trim();
 const rec={id:id,for:g("a_for"),title:g("a_title"),attorney:g("a_attorney"),firm:g("a_firm"),contact:g("a_contact"),case:g("a_case"),filed:g("a_filed"),venue:g("a_venue"),status:+g("a_status"),next:g("a_next"),nextdate:g("a_nextdate"),notes:g("a_notes"),state:g("a_state")};
 const ex=S.attorney.find(x=>x.id===id);
 if(ex)Object.assign(ex,rec);else S.attorney.push(rec);
 save();closeSheet();render();
}
function delAttorney(id){if(!confirm(t("confirmdel")))return;S.attorney=S.attorney.filter(x=>x.id!==id);save();render()}
/* ============ shop & compare ============ */
function renderShop(m){
 let h='<div class="card"><b>🛒 '+t("wts")+'</b><div class="mut" style="margin-top:6px">'+t("wts_health")+': <a href="https://www.healthcare.gov/" target="_blank" rel="noopener" style="color:var(--acc)">HealthCare.gov</a> · <a href="https://www.cuidadodesalud.gov/" target="_blank" rel="noopener" style="color:var(--acc)">CuidadoDeSalud.gov</a></div><div class="mut" style="margin-top:6px">'+t("wts_other")+"</div></div>";
 const best={};
 S.quotes.forEach(q=>{const p=+q.premium||Infinity;if(!(q.type in best)||p<best[q.type])best[q.type]=p});
 const list=S.quotes.slice().sort((a,b)=>(+a.premium||Infinity)-(+b.premium||Infinity));
 if(!list.length)h+='<div class="card mut">'+t("noquotes")+"</div>";
 list.forEach(q=>{
  const p=+q.premium||0,mo=p?Math.round(p/12):0;
  const isbest=p>0&&(+q.premium===best[q.type]);
  const tn=(lang==="es"?QTYPES_ES:QTYPES)[+q.type]||t("other");
  h+='<div class="card"><h3>'+esc(tn)+"</h3>"
  +(isbest?'<span class="pill expsoon">🏆 '+t("bestdeal")+"</span>":"")
  +'<div class="big">'+money(p)+'<span class="mut"> '+t("peryear")+" · "+money(mo)+t("permonth")+"</span></div>"
  +'<div class="mut">'+esc(q.carrier)+"</div>"
  +(q.deductible?'<div class="kv"><span>'+t("q_deductible")+"</span><b>"+money(+q.deductible)+"</b></div>":"")
  +(q.limits?'<div class="kv"><span>'+t("q_limits")+"</span><b>"+esc(q.limits)+"</b></div>":"")
  +(q.exp?'<div class="kv"><span>'+t("q_exp")+"</span><b>"+esc(q.exp)+"</b></div>":"")
  +(q.contact?'<div class="mut">'+esc(q.contact)+"</div>":"")
  +(q.notes?'<div class="mut" style="margin-top:6px;white-space:pre-wrap">'+esc(q.notes)+"</div>":"")
  +'<div class="row"><button class="btn sec" onclick="editQuote(\''+q.id+"')\">"+t("edit")+'</button><button class="btn dgr" onclick="delQuote(\''+q.id+"')\">"+t("del")+"</button></div></div>"});
 h+='<div class="row"><button class="btn" onclick="editQuote(\'\')">'+t("shop_new")+"</button></div>";
 h+='<div class="card"><b>📋 '+t("qreq")+"</b>";
 if(!S.qreq.length)h+='<div class="mut">—</div>';
 S.qreq.slice().reverse().forEach(r=>{
  const rn=(lang==="es"?QTYPES_ES:QTYPES)[+r.type]||t("other");
  h+='<div class="kv"><span>'+esc(r.from)+" · "+esc(rn)+(r.fup?" · "+t("qreq_fup")+": "+esc(r.fup):"")+'</span><button class="btn dgr" style="padding:8px 12px" onclick="delQreq(\''+r.id+"')\">"+t("del")+"</button></div>"});
 h+='<div class="row"><button class="btn sec" onclick="editQreq()">'+t("qreq_new")+"</button></div></div>";
 m.innerHTML=h;
}
function editQuote(id){
 const q=id?S.quotes.find(x=>x.id===id):{id:"q"+Date.now(),type:0,carrier:"",premium:"",deductible:"",limits:"",contact:"",date:new Date().toISOString().slice(0,10),exp:"",notes:""};
 openSheet('<h2>🛒 '+(id?t("edit"):t("shop_new"))+"</h2>"
 +'<label>'+t("q_type")+'</label><select id="q_type">'+qtypeOpts(q.type)+"</select>"
 +'<label>'+t("q_carrier")+'</label><input id="q_carrier" value="'+esc(q.carrier)+'">'
 +'<label>'+t("q_premium")+'</label><input id="q_premium" type="number" min="0" value="'+esc(q.premium)+'">'
 +'<label>'+t("q_deductible")+'</label><input id="q_deductible" type="number" min="0" value="'+esc(q.deductible)+'">'
 +'<label>'+t("q_limits")+'</label><input id="q_limits" value="'+esc(q.limits)+'">'
 +'<label>'+t("q_contact")+'</label><input id="q_contact" value="'+esc(q.contact)+'">'
 +'<label>'+t("q_date")+'</label><input id="q_date" type="date" value="'+esc(q.date)+'">'
 +'<label>'+t("q_exp")+'</label><input id="q_exp" type="date" value="'+esc(q.exp)+'">'
 +'<label>'+t("q_notes")+'</label><textarea id="q_notes">'+esc(q.notes)+"</textarea>"
 +'<div class="row"><button class="btn" onclick="saveQuote(\''+q.id+"')\">"+t("save")+'</button><button class="btn sec" onclick="closeSheet()">'+t("cancel")+"</button></div>");
}
function saveQuote(id){
 const g=i=>document.getElementById(i).value.trim();
 const rec={id:id,type:g("q_type"),carrier:g("q_carrier"),premium:g("q_premium"),deductible:g("q_deductible"),limits:g("q_limits"),contact:g("q_contact"),date:g("q_date"),exp:g("q_exp"),notes:g("q_notes")};
 const ex=S.quotes.find(x=>x.id===id);
 if(ex)Object.assign(ex,rec);else S.quotes.push(rec);
 save();closeSheet();render();
}
function delQuote(id){if(!confirm(t("confirmdel")))return;S.quotes=S.quotes.filter(x=>x.id!==id);save();render()}
function editQreq(){
 openSheet('<h2>📋 '+t("qreq_new")+"</h2>"
 +'<label>'+t("qreq_from")+'</label><input id="r_from">'
 +'<label>'+t("qreq_type")+'</label><select id="r_type">'+qtypeOpts(0)+"</select>"
 +'<label>'+t("qreq_fup")+'</label><input id="r_fup" type="date">'
 +'<div class="row"><button class="btn" onclick="saveQreq()">'+t("save")+'</button><button class="btn sec" onclick="closeSheet()">'+t("cancel")+"</button></div>");
}
function saveQreq(){
 const g=i=>document.getElementById(i).value.trim();
 S.qreq.push({id:"r"+Date.now(),from:g("r_from"),type:g("r_type"),fup:g("r_fup")});
 save();closeSheet();render();
}
function delQreq(id){if(!confirm(t("confirmdel")))return;S.qreq=S.qreq.filter(x=>x.id!==id);save();render()}
/* ============ custom businesses ============ */
function indName(id){const x=INDUSTRIES.find(i=>i.id===id);return x?(lang==="es"?x.es:x.en):""}
function openBizMgr(){
 let h="<h2>🏢 "+t("managebiz")+"</h2>";
 (S.custom||[]).forEach(c=>{
  h+='<div class="kv"><span>'+esc(c.name)+' <span class="mut">('+esc(indName(c.industry))+")</span></span>"+
  '<button class="btn dgr" style="padding:8px 12px" onclick="delBiz(\''+c.id+"')\">"+t("del")+"</button></div>"});
 h+='<label>'+t("bizname")+'</label><input id="nb_name">'
 +'<label>'+t("industry")+'</label><select id="nb_ind">'+INDUSTRIES.map(x=>'<option value="'+x.id+'">'+esc(lang==="es"?x.es:x.en)+"</option>").join("")+"</select>"
 +'<div class="row"><button class="btn" onclick="saveBiz()">'+t("addbiz")+'</button><button class="btn sec" onclick="closeSheet()">'+t("cancel")+"</button></div>";
 openSheet(h);
}
function saveBiz(){
 const name=document.getElementById("nb_name").value.trim();if(!name)return;
 const ind=document.getElementById("nb_ind").value;
 const id="cb"+Date.now();
 const lines=(INDUSTRIES.find(x=>x.id===ind)||{lines:[]}).lines;
 S.custom.push({id:id,name:name,industry:ind});
 S.businesses[id]={coverages:lines.map((lid,i)=>{const l=LIB.find(x=>x.id===lid);return{id:"x"+Date.now()+i,type:lang==="es"?l.es:l.en,priority:2,status:"gap",carrier:"",policy:"",eff:"",exp:"",prem:"",notes:"",state:""}}),claims:[]};
 S.biz=id;save();closeSheet();render();
}
function delBiz(id){if(!confirm(t("confirmdel")))return;S.custom=S.custom.filter(x=>x.id!==id);delete S.businesses[id];if(S.biz===id)S.biz="personal";save();closeSheet();render()}
/* ============ insurance library ============ */
function renderLib(m){
 const q=LIBQ.toLowerCase();
 let h='<div class="card noprint"><input id="libq" placeholder="'+esc(t("lib_search"))+'" value="'+esc(LIBQ)+'" oninput="LIBQ=this.value;renderLib(document.getElementById(\'main\'))"></div>';
 [["p",t("lib_p")],["c",t("lib_c")]].forEach(([g,gl])=>{
  const items=LIB.filter(l=>l.grp===g&&(!q||(l.en+" "+l.es+" "+l.den+" "+l.des).toLowerCase().indexOf(q)>=0));
  if(!items.length)return;
  h+='<div class="card"><b>📚 '+gl+" ("+items.length+")</b></div>";
  items.forEach(l=>{h+='<div class="card"><h3>'+esc(lang==="es"?l.es:l.en)+"</h3>"+'<div class="mut">'+esc(lang==="es"?l.des:l.den)+"</div></div>"});
 });
 m.innerHTML=h;
 const qi=document.getElementById("libq");if(qi){qi.focus();try{qi.setSelectionRange(qi.value.length,qi.value.length)}catch(e){}}
}
/* ============ import/export ============ */
function exportData(){
 const blob=new Blob([JSON.stringify(S)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="insurance-backup.json";a.click();
}
function importData(){
 const i=document.createElement("input");i.type="file";i.accept=".json";
 i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();render()}catch(e){alert("bad file")}};r.readAsText(i.files[0])};
 i.click();
}
/* ============ helpers ============ */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function openSheet(h){document.getElementById("sheet").innerHTML=h;document.getElementById("modal").classList.add("open")}
function closeSheet(){document.getElementById("modal").classList.remove("open")}
function setLang(l){lang=l;S.lang=l;save();render()}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeSheet()});
load();lang=S.lang||"en";if(!applyHash())render();
</script>
