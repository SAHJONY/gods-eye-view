<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAHJONY · Paquetería a Cuba</title>
<style>
:root{--navy-0:#04070f;--navy-1:#060d1d;--gold:#d4af37;--gold-soft:#e8c56a;--ink:#f2f5fa;--muted:#8fa0b8;--line:rgba(212,175,55,.22);--card:rgba(14,26,51,.72);--radius:16px;--grn:#4ade80;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1200px 600px at 80% -10%,rgba(212,175,55,.08),transparent 60%),linear-gradient(180deg,var(--navy-1),var(--navy-0));min-height:100vh;font-size:16px;line-height:1.45;}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:rgba(6,13,29,.9);position:sticky;top:0;z-index:20;backdrop-filter:blur(8px);}
.back{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--gold);font-size:20px;cursor:pointer;display:grid;place-items:center;text-decoration:none;}
.brand{flex:1;min-width:0;} .brand h1{font-size:17px;margin:0;} .brand h1 .sub{display:block;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:1.2px;text-transform:uppercase;}
main{padding:14px 16px 60px;max-width:960px;margin:0 auto;}
h2{font-size:15px;color:var(--gold-soft);text-transform:uppercase;letter-spacing:1px;margin:26px 0 10px;}
.card{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:14px;margin-bottom:12px;}
.card h3{margin:0 0 2px;font-size:17px;}
.card .row{font-size:14px;margin:5px 0;} .card .row .k{color:var(--muted);}
.card a.tel{color:var(--grn);font-weight:800;text-decoration:none;font-size:16px;}
.card .notes{font-size:13px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;}
.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0;}
.rate{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:rgba(6,13,29,.5);}
.rate .v{font-size:17px;font-weight:800;color:var(--gold-soft);} .rate .l{font-size:11px;color:var(--muted);}
ul{padding-left:20px;font-size:14px;} li{margin:7px 0;}
.foot{color:var(--muted);font-size:12px;margin-top:26px;border-top:1px solid var(--line);padding-top:12px;}
</style>
</head>
<body>
<header>
  <a class="back" href="/platform/" aria-label="Volver">‹</a>
  <div class="brand"><h1>📦 Paquetería a Cuba<span class="sub">Agencias · tarifas · seguimiento</span></h1></div>
</header>
<main>
  <h2>Transportista oficial</h2>
  <div id="carrier"></div>
  <h2>Agencias pickup</h2>
  <div id="agencies"></div>
  <h2>Seguimiento</h2>
  <div class="card"><div class="row" id="tracking"></div></div>
  <h2>Pendiente</h2>
  <ul id="pending"></ul>
  <div class="foot" id="foot"></div>
</main>
<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
fetch("data.json",{cache:"no-store"}).then(function(r){return r.json();}).then(function(d){
  var c=d.carrier||{};
  document.getElementById("carrier").innerHTML='<div class="card"><h3>'+esc(c.name)+'</h3>'+
    '<div class="rates">'+(c.rates||[]).map(function(x){return '<div class="rate"><div class="v">'+esc(x.value)+'</div><div class="l">'+esc(x.label)+'</div></div>';}).join("")+'</div>'+
    '<div class="row"><span class="k">📍 </span>'+esc(c.address||"")+'</div>'+
    '<div class="row"><span class="k">🕐 </span>'+esc(c.frequency||"")+'</div>'+
    '<div class="notes">'+esc(c.notes||"")+'</div></div>';
  document.getElementById("agencies").innerHTML=(d.agencies||[]).map(function(a){
    return '<div class="card"><h3>'+esc(a.name)+'</h3>'+
    '<div class="row"><a class="tel" href="tel:'+esc(a.phone.replace(/[^0-9+]/g,""))+'">📞 '+esc(a.phone)+'</a></div>'+
    '<div class="row"><span class="k">📍 </span>'+esc(a.address||"")+'</div><div class="notes">'+esc(a.notes||"")+'</div></div>';
  }).join("");
  document.getElementById("tracking").textContent=d.tracking||"";
  document.getElementById("pending").innerHTML=(d.pending||[]).map(function(m){return"<li>"+esc(m)+"</li>";}).join("");
  document.getElementById("foot").textContent="Inteligencia interna SAHJONY LLC · actualizado "+(d.updated||"—")+" · Tarifas internas no públicas.";
}).catch(function(){document.getElementById("carrier").innerHTML='<div class="card">⚠️ No se pudo cargar data.json</div>';});
</script>
</body>
</html>
