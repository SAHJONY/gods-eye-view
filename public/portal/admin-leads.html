<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leads CRM · Portal SAHJONY LLC</title>
<style>
  :root { --bg:#0b1622; --card:#132433; --accent:#2f9e6e; --text:#eef4f8; --muted:#9db4c6;
          --line:#23405a; --warn:#e8a13d; --danger:#e05d5d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { padding:14px 16px; background:#0d1a28; border-bottom:1px solid var(--line); }
  header .brand { font-size:12px; letter-spacing:2px; color:var(--muted); }
  header h1 { font-size:18px; margin:4px 0 0; }
  header .sub { font-size:13px; color:var(--muted); margin-top:4px; }
  main { max-width:1100px; margin:0 auto; padding:16px 16px 48px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; }
  .card h3 { margin:0 0 10px; font-size:16px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input, select, textarea { width:100%; padding:12px; font-size:15px; border-radius:10px; border:1px solid #2c4a66;
                  background:#0d1a28; color:var(--text); }
  textarea { min-height:70px; resize:vertical; }
  .filters { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:0 12px; }
  button.act { margin-top:14px; padding:13px 18px; font-size:15px; font-weight:700; border:0; border-radius:10px;
               background:var(--accent); color:#06281b; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text);
                 padding:9px 12px; font-size:13px; margin:6px 6px 0 0; border-radius:9px; cursor:pointer; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:9px 6px; border-bottom:1px solid rgba(35,64,90,.6); vertical-align:top; }
  th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:1px; }
  .pill { display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700; }
  .pill.nuevo { background:rgba(157,180,198,.15); color:var(--muted); }
  .pill.contactado { background:rgba(232,161,61,.15); color:#f5c87e; }
  .pill.interesado { background:rgba(56,189,248,.15); color:#7dd3fc; }
  .pill.cliente { background:rgba(47,158,110,.25); color:#bff0d4; }
  .pill.descartado { background:rgba(224,93,93,.15); color:#f3b0b0; }
  .mono { font-family:ui-monospace,monospace; font-size:12px; word-break:break-all; }
  .bizbadge { display:inline-block; padding:3px 9px; border-radius:8px; font-size:11px; font-weight:700;
              background:rgba(56,189,248,.12); color:#7dd3fc; border:1px solid rgba(56,189,248,.35); }
  .stats { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:13px; }
  .stat b { font-size:16px; }
  .pager { display:flex; gap:10px; align-items:center; margin-top:12px; font-size:14px; }
  .notebox { background:#0d1a28; border:1px dashed #2c4a66; border-radius:10px; padding:10px; margin-top:8px; }
  .contact a { color:#7dd3fc; }
  #keyGate { max-width:420px; margin:60px auto; }
  .msg { margin-top:10px; font-size:13px; color:var(--muted); }
  @media (max-width:720px) {
    table, thead, tbody, th, td, tr { display:block; }
    thead { display:none; }
    tr { border:1px solid var(--line); border-radius:12px; margin-bottom:10px; padding:8px 10px; }
    td { border-bottom:none; padding:5px 0; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">SAHJONY LLC · USO INTERNO</div>
  <h1>📇 Leads CRM</h1>
  <div class="sub">Compradores mayoristas · por negocio</div>
</header>
<main>
  <div id="keyGate" class="card">
    <h3>Clave del dueño</h3>
    <label for="ownerKey">PORTAL_OWNER_KEY</label>
    <input id="ownerKey" type="password" autocomplete="off" placeholder="••••••••">
    <button class="act" id="keyGo">Entrar</button>
    <div class="msg">Se guarda solo en esta pestaña (sessionStorage). Nunca sale de este navegador salvo hacia el servidor.</div>
  </div>
  <div id="app" style="display:none">
    <div class="stats" id="stats"></div>
    <div class="card">
      <h3>Filtros</h3>
      <div class="filters">
        <div><label>Buscar</label><input id="fQ" placeholder="Nombre, ciudad, teléfono…"></div>
        <div><label>Negocio</label><select id="fBiz"></select></div>
        <div><label>Región</label><select id="fRegion"><option value="">Todas</option></select></div>
        <div><label>País</label><select id="fCountry"><option value="">Todos</option></select></div>
        <div><label>Tipo</label><select id="fType"><option value="">Todos</option></select></div>
        <div><label>Estado</label><select id="fStatus"><option value="">Todos</option></select></div>
      </div>
      <button class="act" id="fGo">Buscar</button>
      <button class="ghost" id="fClear">Limpiar</button>
      <span class="msg" id="fCount"></span>
    </div>
    <div class="card"><h3>Leads <span class="msg" id="lTotal"></span></h3>
      <div id="lList">…</div>
      <div class="pager">
        <button class="ghost" id="pPrev">← Anterior</button>
        <span id="pInfo"></span>
        <button class="ghost" id="pNext">Siguiente →</button>
      </div>
    </div>
  </div>
</main>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let KEY = sessionStorage.getItem('portal_owner_key') || '';
let UNITS = [];
let OFFSET = 0;
const LIMIT = 25;
const ST_LABEL = { nuevo:'Nuevo', contactado:'Contactado', interesado:'Interesado', cliente:'Cliente', descartado:'Descartado' };

async function admin(path, method='GET', body) {
  const res = await fetch('/api/portal/admin' + path, {
    method,
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + KEY },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  return { status: res.status, data };
}

function unlock() {
  document.getElementById('keyGate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  init();
}

function bizLabel(id) {
  const u = UNITS.find((x) => x.id === id);
  return u ? u.label : id;
}

function currentFilters() {
  const g = (id) => document.getElementById(id).value.trim();
  return { q: g('fQ'), business: g('fBiz'), region: g('fRegion'), country: g('fCountry'), type: g('fType'), status: g('fStatus') };
}

function queryString() {
  const f = currentFilters();
  const p = new URLSearchParams();
  for (const [k, v] of Object.entries(f)) if (v) p.set(k, v);
  p.set('limit', String(LIMIT));
  p.set('offset', String(OFFSET));
  return p.toString();
}

async function loadFilters() {
  const biz = document.getElementById('fBiz').value || '';
  const { data } = await admin('/leads/filters' + (biz ? '?business=' + encodeURIComponent(biz) : ''));
  const fill = (id, values) => {
    const sel = document.getElementById(id);
    const cur = sel.value;
    sel.innerHTML = '<option value="">' + (id === 'fRegion' ? 'Todas' : 'Todos') + '</option>' +
      values.map((v) => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
    if (values.includes(cur)) sel.value = cur;
  };
  fill('fRegion', data.regions || []);
  fill('fCountry', data.countries || []);
  fill('fType', data.types || []);
  const st = document.getElementById('fStatus');
  const curS = st.value;
  st.innerHTML = '<option value="">Todos</option>' + (data.statuses || []).map((s) => `<option value="${esc(s)}">${esc(ST_LABEL[s] || s)}</option>`).join('');
  if ((data.statuses || []).includes(curS)) st.value = curS;
  const counts = data.counts || {};
  const byBiz = data.byBusiness || {};
  const total = Object.values(byBiz).reduce((a, b) => a + b, 0);
  document.getElementById('stats').innerHTML =
    `<div class="stat">Leads <b>${total}</b></div>` +
    Object.entries(counts).map(([s, n]) => `<div class="stat">${esc(ST_LABEL[s] || s)} <b>${n}</b></div>`).join('');
}

async function loadLeads() {
  const { status, data } = await admin('/leads?' + queryString());
  if (status === 401) { sessionStorage.removeItem('portal_owner_key'); location.reload(); return; }
  const list = data.leads || [];
  const total = data.total || 0;
  document.getElementById('fCount').textContent = '';
  document.getElementById('lTotal').textContent = `· ${total} resultado(s)`;
  document.getElementById('pInfo').textContent = total ? `Página ${Math.floor(OFFSET / LIMIT) + 1} de ${Math.max(1, Math.ceil(total / LIMIT))}` : '';
  document.getElementById('lList').innerHTML = list.length ? `<table>
    <tr><th>Lead</th><th>Contacto</th><th>Negocio</th><th>Estado</th><th></th></tr>${list.map((l) => `
    <tr>
      <td><b>${esc(l.name)}</b><br><span class="mono">${esc(l.type || '')}</span><br>${esc(l.city)}${l.city && l.country ? ', ' : ''}${esc(l.country)}${l.address ? '<br><span class="mono">' + esc(l.address) + '</span>' : ''}</td>
      <td class="contact">${l.phone ? '📞 ' + esc(l.phone) + '<br>' : ''}${l.email ? '✉️ <a href="mailto:' + esc(l.email) + '">' + esc(l.email) + '</a><br>' : ''}${l.web ? '🌐 ' + esc(l.web) : ''}</td>
      <td><span class="bizbadge">${esc(bizLabel(l.business))}</span></td>
      <td><span class="pill ${esc(l.status)}">${esc(ST_LABEL[l.status] || l.status)}</span><br>
        <select data-st="${esc(l.id)}" style="margin-top:6px">${Object.keys(ST_LABEL).map((s) => `<option value="${s}"${s === l.status ? ' selected' : ''}>${ST_LABEL[s]}</option>`).join('')}</select></td>
      <td><button class="ghost" data-note="${esc(l.id)}">📝 Notas</button>
        <div class="notebox" id="nb-${esc(l.id)}" style="display:none">
          <textarea id="nt-${esc(l.id)}" placeholder="Notas…">${esc(l.notes || '')}</textarea>
          <button class="ghost" data-savenote="${esc(l.id)}">Guardar nota</button>
        </div>
        ${l.notes ? '<div class="mono" style="margin-top:6px">' + esc(l.notes) + '</div>' : ''}</td>
    </tr>`).join('')}</table>` : 'Sin resultados con esos filtros.';
  document.querySelectorAll('[data-st]').forEach((sel) => sel.addEventListener('change', async () => {
    await admin(`/leads/${sel.dataset.st}`, 'PATCH', { status: sel.value });
    loadLeads(); loadFilters();
  }));
  document.querySelectorAll('[data-note]').forEach((b) => b.addEventListener('click', () => {
    const box = document.getElementById('nb-' + b.dataset.note);
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
  }));
  document.querySelectorAll('[data-savenote]').forEach((b) => b.addEventListener('click', async () => {
    const ta = document.getElementById('nt-' + b.dataset.savenote);
    await admin(`/leads/${b.dataset.savenote}`, 'PATCH', { notes: ta.value });
    loadLeads();
  }));
}

async function init() {
  const { data } = await admin('/leads/business-units');
  UNITS = data.units || [];
  const sel = document.getElementById('fBiz');
  sel.innerHTML = '<option value="">Todos</option>' + UNITS.map((u) => `<option value="${esc(u.id)}">${esc(u.label)}</option>`).join('');
  sel.value = 'cell-phones';
  await loadFilters();
  await loadLeads();
}

document.getElementById('fGo').addEventListener('click', () => { OFFSET = 0; loadLeads(); });
document.getElementById('fClear').addEventListener('click', () => {
  for (const id of ['fQ','fRegion','fCountry','fType','fStatus']) document.getElementById(id).value = '';
  document.getElementById('fBiz').value = 'cell-phones';
  OFFSET = 0; loadLeads();
});
document.getElementById('fBiz').addEventListener('change', () => { OFFSET = 0; loadFilters(); loadLeads(); });
document.getElementById('fQ').addEventListener('keydown', (e) => { if (e.key === 'Enter') { OFFSET = 0; loadLeads(); } });
document.getElementById('pPrev').addEventListener('click', () => { OFFSET = Math.max(0, OFFSET - LIMIT); loadLeads(); });
document.getElementById('pNext').addEventListener('click', () => { OFFSET += LIMIT; loadLeads(); });

const keyInput = document.getElementById('ownerKey');
document.getElementById('keyGo').addEventListener('click', async () => {
  KEY = keyInput.value.trim();
  if (!KEY) return;
  const { status } = await admin('/leads/business-units');
  if (status === 401) { alert('Clave incorrecta.'); return; }
  sessionStorage.setItem('portal_owner_key', KEY);
  unlock();
});
if (KEY) { keyInput.value = KEY; document.getElementById('keyGo').click(); }
</script>
</body>
</html>
