<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal del Cliente · SAHJONY LLC</title>
<style>
  :root { --bg:#0b1622; --card:#132433; --accent:#2f9e6e; --text:#eef4f8; --muted:#9db4c6; --danger:#e05d5d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:radial-gradient(1200px 800px at 50% -10%, #16324a 0%, var(--bg) 60%);
         color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:20px; }
  .card { width:100%; max-width:400px; background:var(--card); border:1px solid #23405a;
          border-radius:16px; padding:28px 24px; box-shadow:0 12px 40px rgba(0,0,0,.45); }
  .brand { text-align:center; margin-bottom:6px; font-size:13px; letter-spacing:3px; color:var(--muted); }
  h1 { text-align:center; font-size:22px; margin:4px 0 2px; }
  p.sub { text-align:center; color:var(--muted); font-size:14px; margin:0 0 22px; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input { width:100%; padding:14px; font-size:16px; border-radius:10px; border:1px solid #2c4a66;
          background:#0d1a28; color:var(--text); }
  input:focus { outline:none; border-color:var(--accent); }
  button { width:100%; margin-top:22px; padding:15px; font-size:17px; font-weight:700; border:0;
           border-radius:12px; background:var(--accent); color:#06281b; cursor:pointer; }
  button:disabled { opacity:.6; }
  .error { display:none; margin-top:14px; padding:12px; border-radius:10px; font-size:14px;
           background:rgba(224,93,93,.12); border:1px solid var(--danger); color:#f3b0b0; }
  .foot { text-align:center; margin-top:18px; font-size:12px; color:var(--muted); }
  .divider { display:flex; align-items:center; gap:10px; margin:20px 0 0; color:var(--muted); font-size:13px; }
  .divider::before, .divider::after { content:""; flex:1; height:1px; background:#23405a; }
  .demo-btn { width:100%; margin-top:14px; padding:14px; font-size:16px; font-weight:600; border-radius:12px;
              border:1px solid #2c4a66; background:transparent; color:var(--text); cursor:pointer; }
  .demo-note { text-align:center; font-size:12px; color:var(--muted); margin:8px 0 0; }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">SAHJONY LLC</div>
    <h1>Portal del Cliente</h1>
    <p class="sub">Siga su carga de puerto a puerto, en vivo.</p>
    <form id="loginForm" autocomplete="on">
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" required autocomplete="username" placeholder="usted@empresa.com">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••">
      <button id="submit" type="submit">Entrar</button>
      <div id="error" class="error" role="alert"></div>
    </form>
    <div class="divider">o</div>
    <button id="demoBtn" type="button" class="demo-btn">Ver demostración</button>
    <p class="demo-note">Explore el portal con datos de muestra, sin contraseña.</p>
    <div class="foot">Servicio incluido sin costo para clientes de SAHJONY LLC.</div>
  </main>
<script>
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('error');
  const submit = document.getElementById('submit');
  function showError(msg) { errorBox.textContent = msg; errorBox.style.display = 'block'; }
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    submit.disabled = true;
    try {
      const res = await fetch('/api/portal/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        showError(data.message || 'No se pudo iniciar sesión. Verifique sus datos.');
        return;
      }
      location.href = '/portal/panel.html';
    } catch {
      showError('Error de conexión. Intente de nuevo.');
    } finally {
      submit.disabled = false;
    }
  });
  const demoBtn = document.getElementById('demoBtn');
  demoBtn.addEventListener('click', async () => {
    errorBox.style.display = 'none';
    demoBtn.disabled = true;
    try {
      const res = await fetch('/api/portal/demo', { method: 'POST' });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        showError(data.message || 'La demostración no está disponible. Intente más tarde.');
        return;
      }
      location.href = '/portal/panel.html';
    } catch {
      showError('Error de conexión. Intente de nuevo.');
    } finally {
      demoBtn.disabled = false;
    }
  });
</script>
</body>
</html>
