<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Comercio Importación/Exportación · SAHJONY LLC</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#273449;--txt:#f1f5f9;--mut:#94a3b8;--acc:#38bdf8;--grn:#4ade80;--yel:#facc15;--red:#f87171;--brd:#334155}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.45;padding-bottom:110px}
header{position:sticky;top:0;z-index:10;background:#0b1220;border-bottom:1px solid var(--brd);padding:12px 14px}
h1{margin:0;font-size:20px}
.sub{color:var(--mut);font-size:13px;margin-top:4px}
.langrow{display:flex;gap:8px;margin-top:10px}
.langbtn{flex:1;min-height:52px;border-radius:12px;border:2px solid var(--brd);background:var(--card);color:var(--txt);font-size:16px;font-weight:700}
.langbtn.on{border-color:var(--acc);background:#0c2a3d}
.sitebtn{display:block;width:100%;min-height:64px;margin-top:10px;border-radius:14px;border:none;font-size:18px;font-weight:800;color:#0b1220;background:var(--grn);text-align:center;text-decoration:none;line-height:64px}
.xlinks{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.xlink{flex:1 0 auto;min-height:52px;display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:12px;border:2px solid var(--brd);background:var(--card);color:var(--txt);font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap}
.viewtabs{display:flex;gap:8px;padding:10px 14px}
.viewtab{flex:1;min-height:52px;border-radius:14px;border:2px solid var(--brd);background:var(--card);color:var(--txt);font-size:16px;font-weight:700}
.viewtab.on{border-color:var(--grn);background:#0d2b1a}
main{padding:6px 14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.kpi{background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:14px}
.kpi .k{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.05em}
.kpi .v{font-size:24px;font-weight:800;margin-top:4px}
.card{background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:16px;margin:12px 0}
.card h3{margin:0 0 6px;font-size:18px}
.sthead{font-size:14px;font-weight:800;color:var(--acc);letter-spacing:.08em;margin:18px 0 4px;text-transform:uppercase}
.pill{display:inline-block;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:800;margin:4px 6px 4px 0}
.green{background:#0d2b1a;color:var(--grn);border:1px solid var(--grn)}
.yellow{background:#33270a;color:var(--yel);border:1px solid var(--yel)}
.red{background:#3b1114;color:var(--red);border:1px solid var(--red)}
.gray{background:#1a2233;color:var(--mut);border:1px solid var(--brd)}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.btn{flex:1;min-height:52px;border-radius:14px;border:none;font-size:16px;font-weight:800;color:#0b1220;background:var(--acc)}
.btn.sec{background:var(--card2);color:var(--txt);border:2px solid var(--brd)}
.btn.dgr{background:#3b1114;color:var(--red);border:1px solid var(--red)}
.btn.grn{background:#0d2b1a;color:var(--grn);border:1px solid var(--grn)}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
input,select,textarea{width:100%;min-height:52px;border-radius:12px;border:2px solid var(--brd);background:#0b1220;color:var(--txt);font-size:16px;padding:10px 12px;margin:6px 0}
textarea{min-height:110px;resize:vertical}
label{font-size:14px;color:var(--mut);font-weight:700}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--brd);font-size:15px}
.kv b{text-align:right}
.math{background:#0b1220;border:1px solid var(--brd);border-radius:12px;padding:12px;margin-top:12px}
.math .mrow{display:flex;justify-content:space-between;margin:5px 0;font-size:14px;color:var(--mut)}
.math .mrow b{color:var(--txt);font-size:15px}
.fab{position:fixed;bottom:18px;right:18px;width:72px;height:72px;border-radius:50%;background:var(--grn);color:#0b1220;font-size:34px;font-weight:900;border:none;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:20;overflow-y:auto;padding:16px}
.modal.open{display:block}
.sheet{background:var(--card);border-radius:18px;padding:18px;max-width:640px;margin:20px auto}
.sheet h2{margin-top:0;font-size:20px}
.disc{font-size:12px;color:var(--mut);padding:14px}
.tap{cursor:pointer}
.empty{padding:24px;text-align:center;border:1px dashed var(--brd);border-radius:16px;color:var(--mut);margin:12px 0}
.scorebar{height:10px;border-radius:6px;background:var(--brd);margin-top:8px}
.scorebar i{display:block;height:100%;border-radius:6px;background:var(--acc)}
</style>
</head>

let lang="es"; const t=k=>T[lang][k]||k;
/* ============ store ============ */
const KEY="sahjony.trade.v1";
const LANGKEY="sahjony.gev.lang";
const STATUSES=["prospect","contacted","quoting","negotiating","won","lost"];
const OPEN=["prospect","contacted","quoting","negotiating"];
let S;
function uid(){try{if(typeof crypto!=="undefined"&&crypto.randomUUID)return crypto.randomUUID()}catch(e){}return "id"+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function nowIso(){try{return new Date(new Date().toLocaleString("en-US",{timeZone:"America/Chicago"})).toISOString()}catch(e){return new Date().toISOString()}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))||null}catch(e){S=null}
 if(!S||!Array.isArray(S.rfqs)||!Array.isArray(S.suppliers))S={rfqs:[],suppliers:[]};
 if(!Array.isArray(S.rfqs))S.rfqs=[];if(!Array.isArray(S.suppliers))S.suppliers=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function setLang(l){lang=l==="es"?"es":"en";try{localStorage.setItem(LANGKEY,lang)}catch(e){}render()}
function supName(id){if(!id)return t("none");const s=S.suppliers.find(x=>x.id===id);return s&&s.name?s.name:t("none")}
function statusPillClass(st){if(st==="won")return "green";if(["contacted","quoting","negotiating"].includes(st))return "yellow";if(st==="lost")return "red";return "gray"}
/* ============ deal economics (same formulas as the trade rfq engine) ============ */
const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
function landedTotal(r){return num(r.unitCost)*num(r.quantity)+num(r.freight)+num(r.duties)+num(r.otherCosts)}
function landedUnit(r){const q=num(r.quantity);return q>0?landedTotal(r)/q:0}
function revenue(r){return num(r.sellUnitPrice)*num(r.quantity)}
function netMargin(r){return revenue(r)-landedTotal(r)}
function netMarginPct(r){const rev=revenue(r);return rev>0?netMargin(r)/rev:0}
function commission(r){return revenue(r)*num(r.commissionPct)/100}
function econScore(r){
 let s=0;
 if(num(r.unitCost)>0&&num(r.sellUnitPrice)>0)s+=30;
 if(num(r.quantity)>0)s+=15;
 if(r.supplierId||r.buyerId)s+=10;
 if(String(r.incoterms||"").trim())s+=5;
 if(num(r.freight)>0||num(r.duties)>0||num(r.otherCosts)>0)s+=15;
 if(String(r.product||"").trim())s+=5;
 if(String(r.originPort||"").trim()&&String(r.destinationPort||"").trim())s+=10;
 const oc=r.originLat!=null&&r.originLat!==""&&r.originLng!=null&&r.originLng!=="";
 const dc=r.destLat!=null&&r.destLat!==""&&r.destLng!=null&&r.destLng!=="";
 if(oc&&dc)s+=10;
 return Math.min(100,Math.max(0,Math.round(s)));
}
function scoreOf(r){const s=Number(r.score);return Number.isFinite(s)?s: econScore(r)}
function verdict(r){
 if(!(num(r.unitCost)>0&&num(r.sellUnitPrice)>0&&num(r.quantity)>0))return "gray";
 const p=netMarginPct(r);
 if(p>=0.10)return "green";if(p>=0.03)return "yellow";return "red";
}
function money(n){const v=Number(n)||0;return "$"+v.toLocaleString("en-US",{maximumFractionDigits:2})}
/* ============ hash routing ============ */
const VIEWS={rfqs:"rfqs",suppliers:"suppliers",add:"add",mercado:"mercado"};
let view="rfqs";
function applyHash(){const h=String(location.hash||"").replace("#","").toLowerCase();view=VIEWS[h]||"rfqs";render();return true}
if(typeof window!=="undefined")window.addEventListener("hashchange",applyHash);
/* ============ render ============ */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function render(){
 document.getElementById("btnEN").classList.toggle("on",lang==="en");
 document.getElementById("btnES").classList.toggle("on",lang==="es");
 document.getElementById("appsub").textContent=t("appsub");
 document.getElementById("sitebtn").textContent=t("site");
 document.getElementById("disclaimer").textContent=t("disclaimer");
 const xl=document.getElementById("xlinks");xl.innerHTML="";
 [["/",t("nav_home")],["/insurance/index.html",t("nav_ins")],["/wholesale/index.html",t("nav_who")],["/crude/index.html",t("nav_cru")],["/cubacash/index.html",t("nav_cc")]].forEach(([u,l])=>{
  const a=document.createElement("a");a.className="xlink";a.href=u;a.textContent=l;xl.appendChild(a)});
 const vt=document.getElementById("viewtabs");vt.innerHTML="";
 [["rfqs",t("trfqs")],["suppliers",t("tsup")],["add",t("tadd")],["mercado",t("tmi")]].forEach(([v,l])=>{
  const b=document.createElement("button");b.className="viewtab"+(view===v?" on":"");b.textContent=l;
  b.onclick=()=>{location.hash=v};vt.appendChild(b)});
 const m=document.getElementById("main");
 if(view==="suppliers")renderSuppliers(m);else if(view==="add")renderAddRfq(m);else if(view==="mercado")renderMercado(m);else renderRfqs(m);
}
function kpiCards(){
 const open=S.rfqs.filter(r=>OPEN.includes(r.status));
 const comm=open.reduce((a,r)=>a+commission(r),0);
 return '<div class="kpis">'
 +'<div class="kpi"><div class="k">'+t("k_total")+'</div><div class="v">'+S.rfqs.length+"</div></div>"
 +'<div class="kpi"><div class="k">'+t("k_open")+'</div><div class="v">'+open.length+"</div></div>"
 +'<div class="kpi"><div class="k">'+t("k_comm")+'</div><div class="v">'+money(comm)+"</div></div>"
 +'<div class="kpi"><div class="k">'+t("k_sup")+'</div><div class="v">'+S.suppliers.length+"</div></div></div>";
}
function statusLabel(s){return t("status_"+s)}
function rfqCard(r){
 const v=verdict(r),sc=scoreOf(r);
 return '<div class="card tap" onclick="openRfq(\''+r.id+'\')">'
 +'<h3>'+esc(r.ref||t("none"))+'</h3>'
 +'<span class="pill '+statusPillClass(r.status)+'">'+statusLabel(r.status)+"</span>"
 +'<span class="pill '+v+'">'+t("v_"+v)+"</span>"
 +'<div class="mut">'+esc(r.product||t("none"))+" · "+num(r.quantity).toLocaleString("en-US")+" "+t("units")+"</div>"
 +'<div class="mut">'+esc(supName(r.supplierId))+"</div>"
 +'<div class="mut">'+t("comm")+": <b style=\"color:var(--txt)\">"+money(commission(r))+"</b></div>"
 +'<div class="mut">'+t("score")+": "+sc+"</div><div class=\"scorebar\"><i style=\"width:"+sc+"%\"></i></div></div>";
}
function renderRfqs(m){
 let h=kpiCards();
 if(!S.rfqs.length)h+='<div class="empty">'+t("norfs")+"</div>";
 STATUSES.forEach(st=>{
  const list=S.rfqs.filter(r=>r.status===st);
  h+='<div class="sthead">'+statusLabel(st)+" ("+list.length+")</div>";
  if(!list.length)h+='<div class="mut" style="padding:0 0 6px">'+t("norfqs_status")+"</div>";
  list.forEach(r=>{h+=rfqCard(r)});
 });
 h+='<div class="row"><button class="btn sec" onclick="exportData()">'+t("export")+'</button><button class="btn sec" onclick="importData()">'+t("import")+"</button></div>";
 m.innerHTML=h;
}
/* ============ RFQ detail ============ */
function openRfq(id){
 const r=S.rfqs.find(x=>x.id===id);if(!r)return;
 const v=verdict(r),sc=scoreOf(r);
 let h='<h2>'+esc(r.ref||t("none"))+'</h2>'
 +'<span class="pill '+statusPillClass(r.status)+'">'+statusLabel(r.status)+"</span>"

function saveRfq(id){
 const g=i=>document.getElementById(i)?document.getElementById(i).value.trim():"";

 const lat=i=>{const s=g(i);if(s==="")return null;const v=Number(s);return Number.isFinite(v)?v:null};
 const rec={ref:g("f_ref"),product:g("f_product"),quantity:n("f_quantity"),
  unitCost:n("f_unitCost"),sellUnitPrice:n("f_sellUnitPrice"),freight:n("f_freight"),
  duties:n("f_duties"),otherCosts:n("f_otherCosts"),commissionPct:n("f_commissionPct"),
  incoterms:g("f_incoterms"),originPort:g("f_originPort"),destinationPort:g("f_destinationPort"),
  originLat:lat("f_originLat"),originLng:lat("f_originLng"),destLat:lat("f_destLat"),destLng:lat("f_destLng"),
  supplierId:g("f_supplierId"),buyerId:g("f_buyerId"),status:g("f_status")||"prospect",notes:g("f_notes")};
 if(!STATUSES.includes(rec.status))rec.status="prospect";
 let r=S.rfqs.find(x=>x.id===id);
 if(r){Object.assign(r,rec);r.updatedAt=nowIso()}
 else{r=Object.assign({id:uid(),agentNotes:[],createdAt:nowIso(),updatedAt:nowIso()},rec);S.rfqs.push(r)}

 save();closeSheet();if(!location.hash||location.hash==="#add")location.hash="rfqs";render();
}

const CC_MAP={USA:"1",Cuba:"53",Guyana:"592",Brasil:"55","Turquía":"90",Turquia:"90",Chile:"56",Vietnam:"84",India:"91",Alemania:"49","Alemania/EE.UU.":"1","Nueva Zelanda":"64"};
function waDigits(p,country){
 const m=String(p||"").match(/\+?[\d][\d\s\-\.\(\)]{5,}[\d]/);
 if(!m)return "";
 let d=m[0].replace(/\D/g,"");
 const cc=CC_MAP[country]||"1";
 if(d.indexOf(cc)!==0)d=cc+d;
 return d;
}
function contactActions(s){
 const c=s.contact||{};
 const wa=waDigits(c.phone,s.country);
 let h="";
 if(c.phone&&wa){
  h+='<a class="btn sec" onclick="event.stopPropagation()" href="tel:+' + wa + '">'+t("call")+"</a>";
  h+='<a class="btn sec" onclick="event.stopPropagation()" target="_blank" rel="noopener" href="https://wa.me/'+wa+'">WhatsApp</a>';
  h+='<a class="btn sec" onclick="event.stopPropagation()" href="sms:+' + wa + '">'+t("sms")+"</a>";
 }
 if(c.email)h+='<a class="btn sec" onclick="event.stopPropagation()" href="mailto:'+esc(c.email)+'">'+t("mail")+"</a>";
 return h?'<div class="row">'+h+"</div>":"";
}

 const plist=supProductList();
 if(plist.length){
  h+='<select id="sup_prodfilter" style="margin-bottom:10px" onchange="SUP_PROD_FILTER=this.value;render()">'
  +'<option value="all">'+t("sup_all")+"</option>"
  +plist.map(p=>'<option value="'+esc(p)+'"'+(SUP_PROD_FILTER===p?" selected":"")+">"+esc(p)+"</option>").join("")
  +"</select>";
 }
 const list=S.suppliers.filter(s=>SUP_PROD_FILTER==="all"||String(s.products||"").split(",").map(x=>x.trim()).includes(SUP_PROD_FILTER));
 if(!list.length)h+='<div class="empty">'+t("nosup")+"</div>";
 list.forEach(s=>{
  h+='<div class="card tap" onclick="editSupplier(\''+s.id+'\')">'
  +'<h3>'+esc(s.name||t("none"))+'</h3>'
  +'<span class="pill '+verPillClass(s.verification)+'">'+t("ver_"+String(s.verification).replace("-","_"))+"</span>"
  +'<div class="mut">'+t("t_"+s.type)+" · "+t("r_"+s.role)+(s.country?" · "+esc(s.country):"")+"</div>"
  +(s.products?'<div class="mut">📦 <b style="color:var(--txt)">'+esc(s.products)+"</b></div>":"")
  +(s.contact&&s.contact.name?'<div class="mut">'+esc(s.contact.name)+"</div>":"")
  +(s.contact&&s.contact.phone?'<div class="mut"><a style="color:var(--acc);font-weight:700" href="tel:'+esc(String(s.contact.phone).replace(/[^\d+]/g,""))+'">'+esc(s.contact.phone)+"</a></div>":"")
  +(s.contact&&s.contact.email?'<div class="mut"><a style="color:var(--acc)" href="mailto:'+esc(s.contact.email)+'">'+esc(s.contact.email)+"</a></div>":"")
  +contactActions(s)
  +(s.notes?'<div class="mut" style="margin-top:6px;white-space:pre-wrap">'+esc(s.notes)+"</div>":"")
  +'<div class="row"><button class="btn sec" onclick="event.stopPropagation();editSupplier(\''+s.id+"')\">"+t("edit")+'</button><button class="btn dgr" onclick="event.stopPropagation();delSupplier(\''+s.id+"')\">"+t("del")+"</button></div></div>";
 });
 h+='<div class="row"><button class="btn" onclick="editSupplier(\'\')">'+t("addsup")+'</button><button class="btn grn" onclick="seedVerifiedSuppliers()">'+t("seeddir")+"</button></div>";
 m.innerHTML=h;
}
function editSupplier(id){
 const s=id?S.suppliers.find(x=>x.id===id):null;
 const f=s||{name:"",type:"manufacturer",role:"supplier",country:"",verification:"unverified",products:"",contact:{},notes:""};
 const c=f.contact||{};
 const typeOpts=SUP_TYPES.map(v=>'<option value="'+v+'"'+(f.type===v?" selected":"")+">"+t("t_"+v)+"</option>").join("");
 const roleOpts=SUP_ROLES.map(v=>'<option value="'+v+'"'+(f.role===v?" selected":"")+">"+t("r_"+v)+"</option>").join("");
 const verOpts=SUP_VERS.map(v=>'<option value="'+v+'"'+(f.verification===v?" selected":"")+">"+t("ver_"+v.replace("-","_"))+"</option>").join("");
 openSheet('<h2>'+(s?t("editsup"):t("newsup"))+"</h2>"
 +'<label>'+t("s_name")+'</label><input id="s_name" value="'+esc(f.name||'')+'">'
 +'<label>'+t("s_type")+'</label><select id="s_type">'+typeOpts+"</select>"
 +'<label>'+t("s_role")+'</label><select id="s_role">'+roleOpts+"</select>"
 +'<label>'+t("s_country")+'</label><input id="s_country" value="'+esc(f.country||'')+'">'
 +'<label>'+t("s_products")+'</label><input id="s_products" placeholder="pollo, arroz" value="'+esc(f.products||'')+'">'
 +'<label>'+t("s_ver")+'</label><select id="s_verification">'+verOpts+"</select>"
 +'<label>'+t("s_cname")+'</label><input id="s_cname" value="'+esc(c.name||'')+'">'
 +'<label>'+t("s_cphone")+'</label><input id="s_cphone" value="'+esc(c.phone||'')+'">'
 +'<label>'+t("s_cemail")+'</label><input id="s_cemail" value="'+esc(c.email||'')+'">'
 +'<label>'+t("notes")+'</label><textarea id="s_notes">'+esc(f.notes||"")+"</textarea>"
 +'<div class="row"><button class="btn" onclick="saveSupplier(\''+(s?s.id:"")+"')\">"+t("save")+'</button><button class="btn sec" onclick="closeSheet()">'+t("cancel")+"</button></div>");
}
function saveSupplier(id){
 const g=i=>document.getElementById(i)?document.getElementById(i).value.trim():"";
 const rec={name:g("s_name"),type:g("s_type")||"manufacturer",role:g("s_role")||"supplier",
  country:g("s_country"),verification:g("s_verification")||"unverified",products:g("s_products"),
  contact:{name:g("s_cname"),phone:g("s_cphone"),email:g("s_cemail")},notes:g("s_notes")};
 if(!SUP_TYPES.includes(rec.type))rec.type="manufacturer";
 if(!SUP_ROLES.includes(rec.role))rec.role="supplier";
 if(!SUP_VERS.includes(rec.verification))rec.verification="unverified";
 let s=S.suppliers.find(x=>x.id===id);
 if(s){Object.assign(s,rec);s.updatedAt=nowIso()}
 else{s=Object.assign({id:uid(),agentNotes:[],createdAt:nowIso(),updatedAt:nowIso()},rec);S.suppliers.push(s)}
 save();closeSheet();render();
}
function delSupplier(id){if(!confirm(t("confirmdel")))return;S.suppliers=S.suppliers.filter(x=>x.id!==id);save();render()}
/* ============ JSON backup ============ */
function exportData(){
 const blob=new Blob([JSON.stringify(S)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="trade-backup.json";a.click();
}
function importData(){
 if(!confirm(t("impreplace")))return;
 const i=document.createElement("input");i.type="file";i.accept=".json";
 i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{
  const d=JSON.parse(r.result);
  if(!d||!Array.isArray(d.rfqs)||!Array.isArray(d.suppliers)){alert(t("badfile"));return}
  S=d;save();render();
 }catch(e){alert(t("badfile"))}};r.readAsText(i.files[0])};
 i.click();
}

function miTyPill(ty){
 if(ty==="s")return '<span class="pill green">'+t("mi_sighted")+'</span>';
 if(ty==="m")return '<span class="pill green">'+t("mi_sighted")+'</span> <span class="pill yellow">'+t("mi_estimated")+'</span>';
 return '<span class="pill yellow">'+t("mi_estimated")+'</span>';
}
/* country-code guess for Mercado directory WhatsApp links (data rows carry no country field) */
const MI_CC_GUESS=[["persaud","592"],["vinafood","84"],["copersucar","55"],["raízen","55"],["raizen","55"],["mutlu","90"],["lucchetti","56"],["cuba-inside","53"],["\\bith\\b","53"],["caribex","53"],["cubaexport","53"],["caribe","53"],["alcona","53"],["coamo","53"],["dayana","53"],["zuko","56"],["58983203","53"],["52400779","53"],["55021481","53"],["63893138","53"],["ajc","1"],["intervision","1"],["thai binh","84"],["thaibinh","84"],["servimundo","62"]];
function miWa(c){
 const n=(String(c.n||"")+" "+String(c.ph||"")).toLowerCase();
 let cc="1";
 for(const pair of MI_CC_GUESS){
  if(new RegExp(pair[0]).test(n)){cc=pair[1];break}
 }
 let d;
 const m0=String(c.ph||"").match(/\+?[\d][\d\s\-\.\(\)]{5,}[\d]/);
 if(!m0)return "";
 d=m0[0].replace(/\D/g,"");
 if(d.indexOf(cc)!==0)d=cc+d;
 return d;
}
function miContact(c){
 let h='<div class="kv"><span>'+esc(c.n)+'</span><b>';
 const parts=[];
 if(c.ph)parts.push('<a style="color:var(--acc);text-decoration:none" href="tel:'+esc(c.ph.replace(/[^\d+]/g,""))+'">'+esc(c.ph)+'</a>');
 const wa=miWa(c);
 if(c.ph&&wa){
  parts.push('<a style="color:var(--acc);text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/'+wa+'">WhatsApp</a>');
  parts.push('<a style="color:var(--acc);text-decoration:none" href="sms:+' + wa + '">SMS</a>');
 }
 if(c.em)parts.push('<a style="color:var(--acc);text-decoration:none" href="mailto:'+esc(c.em)+'">'+esc(c.em)+'</a>');
 if(c.web)parts.push(esc(c.web));
 h+=parts.length?parts.join('<br>'):('<span class="mut">'+t("mi_viaweb")+'</span>');
 h+='</b></div>';
 if(c.nt)h+='<div class="mut">⚠️ '+esc(c.nt)+'</div>';
 return h;
}
function renderMercado(m){
 let h='<div class="mut" style="margin:12px 0">'+t("mi_updated")+'</div>';
 h+='<div class="sthead">'+t("mi_ranking")+'</div>';
 MI_RANK.forEach((r,i)=>{
  h+='<div class="card"><h3>'+(i+1)+'. '+esc(lang==="es"?r.n:r.en)+'</h3>'
  +'<div class="mut">'+t("mi_channel")+': '+esc(r.ch)+'</div>'
  +'<div class="mut">'+t("score")+': <b style="color:var(--txt)">'+r.s+'</b></div>'
  +'<div class="scorebar"><i style="width:'+Math.round(r.s/40*100)+'%"></i></div>';
  if(r.px)h+='<div class="mut" style="margin-top:8px">'+t("mi_price")+': <b style="color:var(--txt)">'+esc(r.px)+'</b> '+miTyPill(r.ty)+'<br>'+esc(r.src)+'</div>';
  else h+='<div class="mut" style="margin-top:8px">'+t("mi_none")+' '+miTyPill("e")+'</div>';
  h+='</div>';
 });
 h+='<div class="sthead">'+t("mi_pulse")+'</div>';
 h+='<div class="mut" style="margin:0 0 10px">'+t("mi_pulse_note")+'</div>';
 MI_PULSE.forEach(p=>{
  const bc=p.out==="UP"?"red":p.out==="DOWN"?"green":p.out==="FLAT"?"yellow":"";
  const ok=p.out==="UP"?"mi_up":p.out==="DOWN"?"mi_down":p.out==="FLAT"?"mi_flat":"mi_nodata";
  let tr=t("mi_7d")+": ";
  tr+=p.d7ok?('<b style="color:'+(p.d7>=0?"var(--red)":"var(--grn)")+'">'+(p.d7>=0?"+":"")+p.d7.toFixed(0)+'%</b>'):'<span class="mut">'+t("mi_sparse")+'</span>';
  tr+=" · "+t("mi_30d")+": ";
  tr+=p.d30ok?('<b style="color:'+(p.d30>=0?"var(--red)":"var(--grn)")+'">'+(p.d30>=0?"+":"")+p.d30.toFixed(0)+'%</b>'):'<span class="mut">'+t("mi_sparse")+'</span>';
  h+='<div class="card"><h3>\u26a1 '+esc(p.p)+'</h3>'
  +'<div class="mut">'+t("mi_ref")+': <b style="color:var(--txt)">'+esc(p.ref)+'</b>'+(p.dt?' \u00b7 '+esc(p.dt):'')+'</div>'
  +'<div class="mut" style="margin-top:6px">'+tr+'</div>'
  +'<div class="mut" style="margin-top:6px"><span class="pill '+bc+'">'+t(ok)+'</span>'
  +(p.ev?' <span class="mut">'+t("mi_evidence")+': '+esc(p.ev)+'</span>':'')+'</div>'
  +'</div>';
 });
 h+='<div class="card"><h3>'+t("mi_fuel")+'</h3><div class="mut">'+t("mi_fuelnote")+'</div></div>';
 h+='<div class="sthead">'+t("mi_cargo")+'</div>';
 h+='<div class="card"><h3>'+t("mi_flow")+'</h3><div class="mut">'+esc(lang==="es"?MI_FLOW.es:MI_FLOW.en)+'</div></div>';
 h+='<div class="card"><h3>'+t("mi_vessels")+'</h3>';
 MI_VESSELS.forEach(v=>{h+='<div class="mut" style="margin:8px 0">• '+esc(lang==="es"?v.es:v.en)+'</div>'});
 h+='</div>';
 h+='<div class="card"><h3>'+t("mi_fuel")+'</h3>';
 MI_FUEL.forEach(f=>{h+='<div class="mut" style="margin:8px 0">• '+esc(lang==="es"?f.es:f.en)+'</div>'});
 h+='<div class="mut" style="margin-top:10px">⚖️ '+t("mi_scp")+'</div></div>';
 h+='<div class="card"><h3>'+t("mi_alert")+'</h3><div class="mut">'+esc(lang==="es"?MI_ALERT.es:MI_ALERT.en)+'</div></div>';
 h+='<div class="sthead">'+t("mi_dir")+'</div>';
 MI_DIR.forEach(d=>{
  h+='<div class="card"><h3>'+esc(lang==="es"?d.n:d.en)+'</h3>'
  +'<div class="mut"><b style="color:var(--txt)">'+t("mi_where")+':</b> '+esc(lang==="es"?d.buy:d.buy_en)+'</div>';
  if(d.px)h+='<div class="mut" style="margin-top:8px"><b style="color:var(--txt)">'+t("mi_price")+':</b> '+esc(d.px)+' '+miTyPill(d.ty)+'<br>'+esc(d.src||'')+'</div>';
  if(d.scp)h+='<div class="mut" style="margin-top:8px">⚖️ '+t("mi_scp")+'</div>';
  if(d.c&&d.c.length){
   h+='<div class="mut" style="margin:10px 0 2px;font-weight:800;color:var(--acc)">'+t("mi_contact")+'</div>';
   d.c.forEach(c=>{h+=miContact(c)});
  }
  if(d.nt)h+='<div class="mut" style="margin-top:8px">⚠️ '+esc(d.nt)+'</div>';
  h+='</div>';
 });
 m.innerHTML=h;
}

function openSheet(h){document.getElementById("sheet").innerHTML=h;document.getElementById("modal").classList.add("open")}
function closeSheet(){document.getElementById("modal").classList.remove("open")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeSheet()});
/* ============ init ============ */
load();
try{const l=localStorage.getItem(LANGKEY);if(l==="es"||l==="en")lang=l}catch(e){}
if(!location.hash)location.hash="rfqs";else applyHash();
if(!location.hash||location.hash==="#rfqs")render();
