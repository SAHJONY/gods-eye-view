<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAHJONY · Plataforma del dueño</title>
<style>
  :root{
    --navy-0:#04070f; --navy-1:#060d1d; --navy-2:#0a1428; --navy-3:#0e1a33;
    --gold:#d4af37; --gold-soft:#e8c56a; --gold-dim:rgba(212,175,55,.16);
    --ink:#f2f5fa; --muted:#8fa0b8; --line:rgba(212,175,55,.22);
    --card:rgba(14,26,51,.72); --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(212,175,55,.08), transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(38,80,160,.25), transparent 60%),
      linear-gradient(180deg, var(--navy-1), var(--navy-0));
    display:flex; flex-direction:column; min-height:100vh; min-height:100dvh;
  }
  header{
    display:flex; align-items:center; gap:12px;
    padding:14px 18px; border-bottom:1px solid var(--line);
    background:rgba(6,13,29,.85); backdrop-filter:blur(8px);
    position:sticky; top:0; z-index:20;
  }
  .brand{display:flex; align-items:center; gap:12px; cursor:pointer; flex:1; min-width:0;}
  .brand .mark{
    width:42px; height:42px; border-radius:12px; flex:none;
    display:grid; place-items:center; font-size:22px;
    background:linear-gradient(135deg, var(--gold), #9a7a1e);
    box-shadow:0 4px 18px rgba(212,175,55,.35);
  }
  .brand h1{font-size:17px; margin:0; letter-spacing:.4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .brand h1 .sub{display:block; font-size:11px; color:var(--muted); font-weight:400; letter-spacing:1.2px; text-transform:uppercase;}
  .lang{display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; flex:none;}
  .lang button{
    border:0; background:transparent; color:var(--muted); font-size:14px; font-weight:700;
    padding:10px 14px; cursor:pointer; min-height:44px;
  }
  .lang button.on{background:var(--gold); color:#0a1428;}
  .shell{display:flex; flex:1; min-height:0;}
  nav.side{
    width:248px; flex:none; padding:18px 12px; border-right:1px solid var(--line);
    display:flex; flex-direction:column; gap:6px; overflow-y:auto;
    background:rgba(6,13,29,.6);
  }
  nav.side .nav-label{font-size:11px; letter-spacing:1.4px; text-transform:uppercase; color:var(--muted); padding:6px 12px 4px;}
  .nav-item{
    display:flex; align-items:center; gap:12px; width:100%;
    padding:13px 12px; border-radius:12px; border:1px solid transparent;
    background:transparent; color:var(--ink); font-size:15px; text-align:left;
    cursor:pointer; min-height:52px;
  }
  .nav-item .ico{font-size:22px; width:30px; text-align:center; flex:none;}
  .nav-item .nm{flex:1; min-width:0;}
  .nav-item .nm small{display:block; color:var(--muted); font-size:12px; margin-top:2px;}
  .nav-item:hover{background:rgba(212,175,55,.07);}
  .nav-item.on{background:var(--gold-dim); border-color:var(--line);}
  .nav-item.soon{opacity:.55;}
  .badge{
    font-size:10px; font-weight:800; letter-spacing:.8px; text-transform:uppercase;
    padding:4px 8px; border-radius:999px; flex:none;
  }
  .badge.live{background:rgba(46,204,113,.15); color:#5fe39a; border:1px solid rgba(46,204,113,.4);}
  .badge.soon{background:rgba(212,175,55,.12); color:var(--gold-soft); border:1px solid var(--line);}
  main{flex:1; min-width:0; display:flex; flex-direction:column; min-height:0;}
  .crumb{
    display:flex; align-items:center; gap:10px; padding:12px 20px;
    border-bottom:1px solid var(--line); font-size:14px; color:var(--muted);
    background:rgba(6,13,29,.5);
  }
  .crumb b{color:var(--ink); font-size:15px;}
  .crumb .sp{flex:1;}
  .crumb a{color:var(--gold-soft); font-size:14px; text-decoration:none; padding:8px 4px; min-height:44px; display:inline-flex; align-items:center;}
  #home{padding:26px 22px; overflow-y:auto; max-width:1060px; width:100%; margin:0 auto;}
  #home h2{margin:4px 0 6px; font-size:24px;}
  #home p.lead{color:var(--muted); margin:0 0 22px; font-size:15px; line-height:1.55;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; cursor:pointer; text-align:left; color:var(--ink); width:100%;
    display:flex; flex-direction:column; gap:8px; min-height:150px;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:hover{transform:translateY(-2px); box-shadow:0 10px 28px rgba(0,0,0,.45);}
  .card .top{display:flex; align-items:center; gap:10px;}
  .card .ico{font-size:28px;}
  .card h3{margin:0; font-size:17px; flex:1;}
  .card p{margin:0; color:var(--muted); font-size:13.5px; line-height:1.5; flex:1;}
  .card.soon{opacity:.6; cursor:default;}
  .card.soon:hover{transform:none; box-shadow:none;}
  .card .go{color:var(--gold-soft); font-size:14px; font-weight:700;}
  .soon-note{
    margin:auto; text-align:center; padding:30px; max-width:420px;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  }
  .soon-note .ico{font-size:44px;}
  .soon-note h3{margin:12px 0 8px;}
  .soon-note p{color:var(--muted); font-size:14px; line-height:1.6;}
  nav.topbar{display:none;}
  @media (max-width:820px){
    nav.side{display:none;}
    nav.topbar{
      display:flex; gap:8px; overflow-x:auto; padding:10px 12px;
      border-bottom:1px solid var(--line); background:rgba(6,13,29,.7);
      scrollbar-width:none;
    }
    nav.topbar::-webkit-scrollbar{display:none;}
    .nav-item{flex:none; width:auto; padding:10px 14px; min-height:48px;}
    .nav-item .nm small{display:none;}
    .brand h1{font-size:15px;}
    #home{padding:18px 14px;}
  }
</style>
</head>
<body>
<header>
  <div class="brand" id="brand" role="button" tabindex="0" aria-label="SAHJONY home">
    <div class="mark">◈</div>
    <h1>SAHJONY LLC<span class="sub" id="brandSub">Trade &amp; Energy Platform</span></h1>
  </div>
  <div class="lang" role="group" aria-label="Language / Idioma">
    <button id="btnEs" type="button">ES</button>
    <button id="btnEn" type="button">EN</button>
  </div>
</header>

<div class="shell">
  <nav class="side" id="sideNav" aria-label="Modules"></nav>
  <main>
    <nav class="topbar" id="topNav" aria-label="Modules"></nav>
    <div class="crumb" id="crumb" hidden>
      <span id="crumbHome">◈</span><span>/</span><b id="crumbName"></b>
      <span class="sp"></span>
      <a id="crumbOpen" href="#" target="_blank" rel="noopener">↗</a>
    </div>
    <div id="home"></div>
  </main>
</div>

<script>
(function(){
  'use strict';
  var LANG_KEY = 'sahjony.owner.lang';
  var lang = localStorage.getItem(LANG_KEY) || 'es';
  if (lang !== 'es' && lang !== 'en') lang = 'es';

  var STR = {
    es: {
      home: 'Inicio', modules: 'Módulos', openNew: 'Abrir en pestaña nueva',
      welcome: 'Centro de mando del dueño',
      lead: 'Todos los negocios de la plataforma en un solo lugar. Elige un módulo para trabajar en él sin salir de aquí.',
      live: 'En vivo', soon: 'Pronto', open: 'Abrir →',
      soonTitle: 'Módulo en camino',
      soonBody: 'Este módulo está en el plan de construcción. Aparecerá aquí automáticamente cuando esté listo.',
      noModules: 'No se pudo cargar el registro de módulos.',
      brandSub: 'Plataforma de comercio y energía'
    },
    en: {
      home: 'Home', modules: 'Modules', openNew: 'Open in new tab',
      welcome: "Owner's command center",
      lead: 'Every business on the platform in one place. Pick a module to work in it without leaving here.',
      live: 'Live', soon: 'Soon', open: 'Open →',
      soonTitle: 'Module on the way',
      soonBody: 'This module is on the build roadmap. It will appear here automatically when ready.',
      noModules: 'Could not load the module registry.',
      brandSub: 'Trade & Energy Platform'
    }
  };
  function t(key){ return (STR[lang] && STR[lang][key]) || STR.es[key] || key; }

  var modules = Array.isArray(window.__PLATFORM_MODULES) ? window.__PLATFORM_MODULES : null;

  var sideNav = document.getElementById('sideNav');
  var topNav = document.getElementById('topNav');
  var home = document.getElementById('home');
  var crumb = document.getElementById('crumb');
  var crumbName = document.getElementById('crumbName');
  var crumbHome = document.getElementById('crumbHome');
  var crumbOpen = document.getElementById('crumbOpen');
  var brand = document.getElementById('brand');

  function byId(id){ return modules.filter(function(m){ return m.id === id; })[0] || null; }
  function label(m){ return (m.name && (m.name[lang] || m.name.es)) || m.id; }

  function badge(m){
    var s = document.createElement('span');
    s.className = 'badge ' + (m.status === 'live' ? 'live' : 'soon');
    s.textContent = m.status === 'live' ? t('live') : t('soon');
    return s;
  }

  function buildNav(container){
    container.innerHTML = '';
    if (container === sideNav){
      var lab = document.createElement('div');
      lab.className = 'nav-label'; lab.textContent = t('modules');
      container.appendChild(lab);
    }
    var homeBtn = document.createElement('button');
    homeBtn.type = 'button'; homeBtn.className = 'nav-item'; homeBtn.dataset.nav = '';
    homeBtn.innerHTML = '<span class="ico">◈</span><span class="nm">' + t('home') + '</span>';
    homeBtn.addEventListener('click', function(){ location.hash = '#/'; });
    container.appendChild(homeBtn);
    modules.forEach(function(m){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'nav-item' + (m.status === 'live' ? '' : ' soon');
      b.dataset.nav = m.id;
      var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = label(m);
      var sm = document.createElement('small'); sm.textContent = (m.tagline && (m.tagline[lang] || m.tagline.es)) || '';
      nm.appendChild(sm);
      var ico = document.createElement('span'); ico.className = 'ico'; ico.textContent = m.icon || '▦';
      b.appendChild(ico); b.appendChild(nm); b.appendChild(badge(m));
      b.addEventListener('click', function(){ location.hash = '#/' + m.id; });
      container.appendChild(b);
    });
  }

  function markActive(id){
    [sideNav, topNav].forEach(function(nav){
      Array.prototype.forEach.call(nav.querySelectorAll('.nav-item'), function(el){
        el.classList.toggle('on', el.dataset.nav === id);
      });
    });
  }

  function renderHome(){
    home.innerHTML = ''; home.style.display = '';
    crumb.hidden = true;
    var h = document.createElement('h2'); h.textContent = t('welcome');
    var p = document.createElement('p'); p.className = 'lead'; p.textContent = t('lead');
    var grid = document.createElement('div'); grid.className = 'grid';
    modules.forEach(function(m){
      var c = document.createElement('button');
      c.type = 'button'; c.className = 'card' + (m.status === 'live' ? '' : ' soon');
      var top = document.createElement('div'); top.className = 'top';
      var ico = document.createElement('span'); ico.className = 'ico'; ico.textContent = m.icon || '▦';
      var hh = document.createElement('h3'); hh.textContent = label(m);
      top.appendChild(ico); top.appendChild(hh); top.appendChild(badge(m));
      var d = document.createElement('p'); d.textContent = (m.tagline && (m.tagline[lang] || m.tagline.es)) || '';
      c.appendChild(top); c.appendChild(d);
      if (m.status === 'live'){
        var go = document.createElement('span'); go.className = 'go'; go.textContent = t('open');
        c.appendChild(go);
        c.addEventListener('click', function(){ location.hash = '#/' + m.id; });
      }
      grid.appendChild(c);
    });
    home.appendChild(h); home.appendChild(p); home.appendChild(grid);
    document.title = 'SAHJONY · ' + t('welcome');
    markActive('');
  }

  function renderSoon(m){
    home.innerHTML = ''; home.style.display = '';
    crumb.hidden = true;
    var box = document.createElement('div'); box.className = 'soon-note';
    box.innerHTML = '<div class="ico">' + (m.icon || '▦') + '</div>';
    var h = document.createElement('h3'); h.textContent = label(m) + ' — ' + t('soon');
    var p = document.createElement('p'); p.textContent = t('soonBody');
    var p2 = document.createElement('p'); p2.textContent = (m.tagline && (m.tagline[lang] || m.tagline.es)) || '';
    box.appendChild(h); box.appendChild(p); box.appendChild(p2);
    home.appendChild(box);
    document.title = 'SAHJONY · ' + label(m);
    markActive(m.id);
  }

  // Modules open as full pages (top-level navigation), never embedded in an
  // iframe: the iframe painted black on iOS Safari while the same pages
  // load fine standalone. Every module page links back to /platform/.
  function renderModule(m){
    location.href = m.path;
  }

  function route(){
    var id = (location.hash || '#/').replace(/^#\//, '');
    if (!id){ renderHome(); return; }
    var m = byId(id);
    if (!m){ renderHome(); return; }
    if (m.status === 'live') renderModule(m); else renderSoon(m);
  }

  function applyLang(){
    document.documentElement.lang = lang;
    document.getElementById('btnEs').classList.toggle('on', lang === 'es');
    document.getElementById('btnEn').classList.toggle('on', lang === 'en');
    document.getElementById('brandSub').textContent = t('brandSub');
    localStorage.setItem(LANG_KEY, lang);
    buildNav(sideNav); buildNav(topNav); route();
  }

  document.getElementById('btnEs').addEventListener('click', function(){ lang = 'es'; applyLang(); });
  document.getElementById('btnEn').addEventListener('click', function(){ lang = 'en'; applyLang(); });
  brand.addEventListener('click', function(){ location.hash = '#/'; });
  brand.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ location.hash = '#/'; } });
  window.addEventListener('hashchange', route);

  function boot(list){
    modules = list;
    if (!modules || !modules.length){
      home.innerHTML = '<p class="lead">' + t('noModules') + '</p>';
      return;
    }
    applyLang();
  }

  if (modules) { boot(modules); }
  else {
    fetch('/api/platform/modules', { headers: { 'Accept': 'application/json' } })
      .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function(j){ boot(j.modules || []); })
      .catch(function(){ boot([]); });
  }
})();
</script>
</body>
</html>
