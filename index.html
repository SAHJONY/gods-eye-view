<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>God's Eye View</title>
  <!-- Client tracking mode: rebrand BEFORE first paint so the internal
       tool name never flashes in the tab or loader. Runs synchronously
       in <head>, ahead of the module bootstrap that does the full rebrand. -->
  <script>
    (function () {
      try {
        var m = /(?:^|[?&])client=1(?:&|$)/.test(
          String(window.location.hash || '').replace(/^#/, '')
        );
        if (!m) return;
        document.title = 'SAHJONY · Seguimiento de buque en vivo';
        document.documentElement.classList.add('gev-client-mode');
        var s = document.createElement('style');
        s.id = 'gev-client-bootstrap';
        s.textContent =
          '#loading-screen h2{visibility:hidden}' +
          '#loading-screen h2::after{content:"SAHJONY · Seguimiento de buque en vivo";visibility:visible;display:block}';
        document.head.appendChild(s);
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <!-- Icon font subset to the glyphs this app renders. Keep `icon_names` in sync
       with the sources: src/materialSymbolsSubset.test.mjs fails when a source
       names a glyph this list is missing, because a missing glyph does not draw
       a box — the ligature never forms and the element renders the literal word. -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&icon_names=adjust,arrow_drop_down,arrow_forward,arrow_left,arrow_right,bolt,breached,chevron_left,chevron_right,close,close_fullscreen,dark_mode,draw,east,es,flare,flight,layers_clear,light_mode,local_fire_department,my_location,navigation,normal,on,open_in_full,public,radar,radio,right_panel_close,right_panel_open,rocket_launch,skip_next,skip_previous,unverified,vencidos,verificado,verified,view_in_ar" rel="stylesheet" />
</head>
